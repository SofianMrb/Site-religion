voir des puissants de ce monde.*\n\n## 4️⃣ Al-Quddus (الْقُدُّوسُ) — Le Pur, le Sacré\nAllah est totalement exempt de tout défaut, de toute imperfection, de tout ce qui pourrait être associé à la création. Même les anges L'exaltent par ce nom dans le Coran (Sourate Al-Jumu'a). *Rien en Lui ne ressemble à ce que nous connaissons.*\n\n## 5️⃣ As-Salam (السَّلامُ) — La Paix, la Source de la paix\nAllah est Lui-même exempt de tout défaut et de toute anomalie, et c'est de Lui que provient toute véritable paix — celle du cœur, celle des relations, celle du Paradis (appelé « Dar as-Salam », la demeure de la paix). *Chercher la paix intérieure, c'est finalement chercher à se rapprocher de Lui.*\n\n## 6️⃣ Al-Mu'min (الْمُؤْمِنُ) — Celui qui accorde la sécurité\nCe nom désigne Celui qui rassure les cœurs des croyants et éloigne la peur — comme un père qui rassure son enfant effrayé dans le noir. *Face à l'angoisse, se souvenir qu'Allah est Al-Mu'min ramène un calme profond.*\n\n## 7️⃣ Al-Muhaymin (الْمُهَيْمِنُ) — Le Protecteur vigilant\nAllah veille sur toute Sa création en permanence, sans jamais dormir ni se distraire — rien ne Lui échappe, pas même la pensée la plus discrète. *Savoir cela pousse à une sincérité constante, même quand personne ne regarde.*\n\n## 8️⃣ Al-Aziz (الْعَزِيزُ) — Le Tout-Puissant\nAllah est invincible, jamais vaincu, jamais dans le besoin — une puissance absolue qui n'a besoin de personne pour s'exercer. *Face à un sentiment de faiblesse ou d'injustice, ce nom rappelle que la vraie force appartient entièrement à Allah.*\n\n## 9️⃣ Al-Jabbar (الْجَبَّارُ) — Le Contraignant, le Réparateur\nCe nom a deux facettes : Celui qui contraint toute Sa création à Sa volonté, et Celui qui répare ce qui est brisé — un cœur meurtri, une situation désespérée. *Comme un os cassé qui se ressoude, Allah restaure ce qui semblait perdu.*\n\n## 🔟 Al-Mutakabbir (الْمُتَكَبِّرُ) — Le Suprême, le Majestueux\nSeul Allah a le droit à une grandeur absolue — c'est pour cela que l'orgueil est interdit à l'être humain : se sentir supérieur aux autres, c'est usurper un attribut qui n'appartient qu'à Allah. *La vraie humilité commence par reconnaître que la grandeur Lui revient entièrement.*\n\n---\n\n> 🤲 Ces dix premiers noms posent une base : la miséricorde d'Allah précède toujours Sa rigueur, mais Sa souveraineté et Sa puissance restent absolues. Comprendre l'un sans l'autre donne une image incomplète."},{"title":"2️⃣ Les Noms d'Allah 11 à 20","content":"## 1️⃣1️⃣ Al-Khaliq (الْخَالِقُ) — Le Créateur\nAllah crée à partir du néant, sans modèle préexistant, sans effort ni fatigue — il Lui suffit de dire « Sois » pour que la chose soit (Coran, Ya-Sin 36:82). *Aucun artiste humain ne crée ainsi : il transforme toujours une matière déjà existante.*\n\n## 1️⃣2️⃣ Al-Bari' (الْبَارِئُ) — L'Initiateur, le Producteur sans défaut\nCe nom décrit Celui qui donne naissance à la création de manière parfaitement proportionnée, sans la moindre incohérence — chaque organe, chaque équilibre biologique est calculé avec précision. *La nature entière témoigne de ce soin dans les détails.*\n\n## 1️⃣3️⃣ Al-Musawwir (الْمُصَوِّرُ) — Le Formateur\nAllah donne à chaque chose sa forme unique — aucun visage humain, malgré des milliards d'individus, n'est totalement identique à un autre. *Ce nom rappelle que ta forme, ton visage, ton apparence ne sont pas le fruit du hasard, mais un choix précis d'Allah.*\n\n## 1️⃣4️⃣ Al-Ghaffar (الْغَفَّارُ) — Celui qui pardonne sans cesse\nCe nom insiste sur la répétition : Allah pardonne encore et encore, même si le péché revient plusieurs fois dans la même journée. *Comme un enseignant patient qui reprend inlassablement le même élève, sans jamais se lasser de lui donner une nouvelle chance.*\n\n## 1️⃣5️⃣ Al-Qahhar (الْقَهَّارُ) — Le Dominateur suprême\nRien ni personne ne peut résister à Sa volonté — les tyrans les plus puissants de l'histoire ont fini par disparaître devant Lui. *Ce nom rassure celui qui subit une injustice : même l'oppresseur le plus fort reste totalement soumis à Allah.*\n\n## 1️⃣6️⃣ Al-Wahhab (الْوَهَّابُ) — Le Dispensateur généreux\nAllah donne sans compter et sans attendre de retour — contrairement à un don humain qui espère souvent une reconnaissance. *Chaque bienfait reçu dans une journée — la vue, la santé, un repas — est un don d'Al-Wahhab, même ceux qu'on ne remarque plus.*\n\n## 1️⃣7️⃣ Ar-Razzaq (الرَّزَّاقُ) — Le Pourvoyeur\nAllah assure la subsistance de chaque créature, du plus petit insecte au plus grand animal — personne n'est oublié. *S'inquiéter exagérément pour sa subsistance revient à oublier que le Pourvoyeur ne dort jamais.*\n\n## 1️⃣8️⃣ Al-Fattah (الْفَتَّاحُ) — Celui qui ouvre, le Juge\nCe nom désigne Celui qui ouvre les portes fermées — solutions, opportunités, guidance — et qui tranche entre le vrai et le faux avec justice. *Dans une impasse, demander à Al-Fattah, c'est demander l'ouverture là où tout semblait bloqué.*\n\n## 1️⃣9️⃣ Al-'Alim (الْعَلِيمُ) — L'Omniscient\nSa connaissance englobe le passé, le présent, le futur, le visible et l'invisible — y compris les pensées les plus secrètes. *Aucune science humaine, aussi avancée soit-elle, n'approche l'étendue de cette connaissance.*\n\n## 2️⃣0️⃣ Al-Qabid (الْقَابِضُ) — Celui qui restreint\nAllah peut resserrer la subsistance, les circonstances, les cœurs, selon Sa sagesse — pas comme punition systématique, mais parfois comme épreuve ou protection. *Une période difficile n'est pas forcément un signe de colère divine : elle peut cacher une sagesse invisible.*\n\n---\n\n> 🤲 Ces dix noms montrent Allah comme Créateur minutieux et Pourvoyeur généreux, tout en rappelant qu'Il reste souverain sur ce qu'Il donne et ce qu'Il retient."},{"title":"3️⃣ Les Noms d'Allah 21 à 30","content":"## 2️⃣1️⃣ Al-Basit (الْبَاسِطُ) — Celui qui étend\nL'opposé d'Al-Qabid : Allah peut élargir la subsistance, dilater les cœurs vers la foi, ouvrir des opportunités. *Comme des poumons qui se dilatent après une longue apnée, la vie peut soudain s'élargir après une période d'étreinte.*\n\n## 2️⃣2️⃣ Al-Khafid (الْخَافِضُ) — Celui qui abaisse\nAllah rabaisse ceux qui s'élèvent injustement dans l'orgueil ou la tyrannie — aucune élévation illégitime ne dure éternellement face à Lui. *L'histoire regorge de puissants tombés brutalement, rappel constant de ce nom.*\n\n## 2️⃣3️⃣ Ar-Rafi' (الرَّافِعُ) — Celui qui élève\nÀ l'inverse, Allah élève en rang, en statut, en proximité avec Lui, ceux qui se soumettent sincèrement — pas forcément selon les critères du monde (richesse, popularité), mais selon la piété du cœur. *La vraie élévation est parfois invisible aux yeux des hommes.*\n\n## 2️⃣4️⃣ Al-Mu'izz (الْمُعِزُّ) — Celui qui honore\nAllah accorde honneur et dignité à qui Il veut, sans que cela dépende toujours des richesses ou du rang social. *Un serviteur pauvre mais sincère peut avoir plus d'honneur auprès d'Allah qu'un roi arrogant.*\n\n## 2️⃣5️⃣ Al-Mudhill (الْمُذِلُّ) — Celui qui humilie\nDe même, Allah peut retirer l'honneur à qui Il veut, selon Sa justice parfaite — aucune humiliation subie injustement par un homme n'est jamais un jugement final. *Ces deux noms rappellent que l'honneur véritable ne dépend jamais des hommes, mais d'Allah seul.*\n\n## 2️⃣6️⃣ As-Sami' (السَّمِيعُ) — Celui qui entend tout\nAucun son, aucune plainte, aucun murmure silencieux ne Lui échappe — même la voix la plus faible, portée par le cœur sans un mot prononcé, est entièrement entendue. *Se sentir seul face à une épreuve n'est jamais totalement vrai : As-Sami' entend chaque soupir.*\n\n## 2️⃣7️⃣ Al-Basir (الْبَصِيرُ) — Celui qui voit tout\nRien n'échappe à Son regard, ni les grandes actions publiques, ni les gestes les plus discrets accomplis dans l'intimité. *Ce nom encourage la sincérité dans l'action même quand personne d'autre ne regarde.*\n\n## 2️⃣8️⃣ Al-Hakam (الْحَكَمُ) — L'Arbitre, le Juge\nAllah tranche entre les créatures avec une justice absolue, sans possibilité d'appel ni erreur — Son jugement final est le seul qui compte réellement. *Face à une injustice impossible à réparer ici-bas, ce nom rappelle qu'un jugement parfait viendra.*\n\n## 2️⃣9️⃣ Al-'Adl (الْعَدْلُ) — Le Juste, l'Équitable\nAllah ne lèse personne, même du poids d'un atome (Coran, An-Nisa 4:40) — Sa justice ne se trompe jamais et ne favorise personne injustement. *Aucune bonne action, aussi petite soit-elle, ne sera perdue devant cette équité parfaite.*\n\n## 3️⃣0️⃣ Al-Latif (اللَّطِيفُ) — Le Doux, le Subtil\nAllah agit avec une douceur et une finesse extrêmes, souvent invisibles à l'œil nu — Il connaît le détail le plus subtil des besoins d'un cœur avant même que celui-ci ne les exprime. *Beaucoup de bienfaits arrivent sans qu'on comprenne comment ni pourquoi — c'est la subtilité d'Al-Latif.*\n\n---\n\n> 🤲 Ces dix noms forment des paires (élever/abaisser, honorer/humilier) : ils rappellent qu'Allah dirige seul les hauts et les bas de l'existence, avec une justice et une douceur parfaites."},{"title":"4️⃣ Les Noms d'Allah 31 à 40","content":"## 3️⃣1️⃣ Al-Khabir (الْخَبِيرُ) — Celui qui est parfaitement informé\nAllah connaît la réalité profonde des choses, pas seulement leur apparence — les intentions cachées, les motivations réelles derrière chaque acte. *Contrairement à l'être humain souvent trompé par les apparences, rien ne trompe Al-Khabir.*\n\n## 3️⃣2️⃣ Al-Halim (الْحَلِيمُ) — Le Longanime\nAllah retarde le châtiment même quand la désobéissance est évidente, laissant une chance de se corriger — comme un professeur patient qui ne renvoie pas immédiatement l'élève turbulent. *Si les fautes étaient sanctionnées instantanément, personne ne survivrait longtemps.*\n\n## 3️⃣3️⃣ Al-'Azim (الْعَظِيمُ) — L'Immense, le Magnifique\nSa grandeur dépasse toute mesure et toute comparaison humaine — le Trône d'Allah englobe les cieux et la terre selon le Coran (Al-Baqara 2:255). *Aucune échelle humaine ne peut mesurer cette immensité.*\n\n## 3️⃣4️⃣ Al-Ghafur (الْغَفورُ) — Le Très Pardonneur\nAllah couvre et efface entièrement les péchés sincèrement repentis, comme s'ils n'avaient jamais existé. *Même une vie remplie de fautes ne décourage jamais un repentir sincère face à ce nom.*\n\n## 3️⃣5️⃣ Ash-Shakur (الشَّكُورُ) — Le Reconnaissant\nAllah récompense généreusement le moindre effort sincère, même minime — une bonne action peut être multipliée jusqu'à 700 fois (Coran, Al-Baqara 2:261). *Aucun petit geste de bien n'est jamais considéré comme négligeable.*\n\n## 3️⃣6️⃣ Al-'Aliyy (الْعَلِيُّ) — Le Très-Haut\nAllah est au-dessus de toute création, non pas au sens d'une position géographique, mais d'une transcendance totale et d'une supériorité absolue. *Rien ne peut Lui être comparé, ni en rang, ni en essence.*\n\n## 3️⃣7️⃣ Al-Kabir (الْكَبِيرُ) — Le Grand\nSa grandeur dépasse tout ce que l'esprit humain peut imaginer ou concevoir — c'est pour cela qu'on répète « Allahu Akbar » (Allah est plus grand) dans la prière, jamais « Allah est grand » tout court. *Il est toujours plus grand que tout ce à quoi on pourrait Le comparer.*\n\n## 3️⃣8️⃣ Al-Hafiz (الْحَفِيظُ) — Le Préservateur\nAllah préserve la création, le Coran (inégalable dans son intégrité depuis 14 siècles), et enregistre chaque action pour le Jour du Jugement. *Ce nom rassure : rien de bien accompli n'est jamais réellement perdu.*\n\n## 3️⃣9️⃣ Al-Muqit (الْمُقِيتُ) — Celui qui nourrit, qui donne la force\nAllah fournit non seulement la nourriture physique, mais aussi la force nécessaire pour accomplir chaque tâche de la vie. *Face à l'épuisement, se rappeler ce nom aide à demander la force plutôt que de compter uniquement sur soi-même.*\n\n## 4️⃣0️⃣ Al-Hasib (الْحَسِيبُ) — Celui qui suffit, le Comptable\nCe nom rassemble deux idées : Allah suffit entièrement à celui qui place sa confiance en Lui, et Il tient un compte précis de chaque action. *« Hasbunallah wa ni'mal wakil » (Allah nous suffit, Il est le meilleur garant) est une formule tirée directement de ce nom.*\n\n---\n\n> 🤲 Cette section combine la connaissance parfaite d'Allah, Sa patience envers les fautes, et Sa générosité à récompenser le moindre effort — de quoi relativiser ses propres limites avec espoir."},{"title":"5️⃣ Les Noms d'Allah 41 à 50","content":"## 4️⃣1️⃣ Al-Jalil (الْجَلِيلُ) — Le Majestueux\nCe nom exprime une grandeur qui inspire un profond respect mêlant crainte et amour — la majesté d'un Roi qu'on ne pourrait jamais confondre avec un simple pair. *La crainte d'Allah, quand elle est bien comprise, n'est pas de la terreur mais du respect mesuré par cette majesté.*\n\n## 4️⃣2️⃣ Al-Karim (الْكَرِيمُ) — Le Généreux, le Noble\nAllah donne avec une noblesse qui dépasse toute attente — Il pardonne sans humilier, Il donne sans qu'on ait besoin de mendier longuement. *La générosité humaine la plus admirable reste une pâle imitation de celle d'Al-Karim.*\n\n## 4️⃣3️⃣ Ar-Raqib (الرَّقِيبُ) — L'Observateur vigilant\nAllah observe chaque instant sans jamais se relâcher, comme une caméra de surveillance qui ne s'éteint jamais, mais avec une bienveillance que l'image ne rend pas. *Cette vigilance constante pousse à la cohérence entre ce qu'on montre et ce qu'on est vraiment.*\n\n## 4️⃣4️⃣ Al-Mujib (الْمُجِيبُ) — Celui qui répond\nAllah répond à celui qui L'invoque, même si la réponse ne prend pas la forme attendue — parfois un refus est en réalité une protection. *Trois formes de réponse existent selon les savants : obtenir ce qu'on demande, voir un mal évité en échange, ou une récompense gardée pour l'au-delà.*\n\n## 4️⃣5️⃣ Al-Wasi' (الْوَاسِعُ) — Le Vaste\nSa miséricorde, Sa connaissance et Ses dons n'ont aucune limite mesurable — rien ne Le restreint jamais, contrairement aux ressources humaines toujours finies. *Aucune demande, si grande soit-elle, ne peut épuiser cette vastitude.*\n\n## 4️⃣6️⃣ Al-Hakim (الْحَكِيمُ) — Le Sage\nChaque décret d'Allah, même ceux qui semblent incompréhensibles sur le moment, s'inscrit dans une sagesse parfaite — rien n'est arbitraire. *Une épreuve difficile prend souvent son sens des années plus tard, révélant la sagesse qui s'y cachait.*\n\n## 4️⃣7️⃣ Al-Wadud (الْوَدُودُ) — L'Affectueux\nAllah aime profondément Ses serviteurs sincères et se fait aimer d'eux en retour — une relation d'amour véritable, pas seulement de crainte distante. *Ce nom rappelle que la religion n'est pas qu'une suite d'obligations, mais aussi une histoire d'amour réciproque.*\n\n## 4️⃣8️⃣ Al-Majid (الْمَجِيدُ) — Le Glorieux\nSa gloire combine grandeur et générosité à un niveau que rien ne peut égaler — Il n'a besoin de rien pour être glorieux, contrairement aux hommes qui cherchent constamment la reconnaissance des autres. *Sa gloire Lui est propre, indépendante de tout regard extérieur.*\n\n## 4️⃣9️⃣ Al-Ba'ith (الْبَاعِثُ) — Celui qui ressuscite\nAllah redonnera la vie à tous les êtres après leur mort pour le Jour du Jugement — celui qui a créé une première fois peut recréer sans difficulté. *Ce nom donne un sens à la mort : elle n'est pas une fin, mais une étape avant un nouveau départ.*\n\n## 5️⃣0️⃣ Ash-Shahid (الشَّهِيدُ) — Le Témoin\nAllah est témoin de toute chose, en tout lieu, en tout temps — aucun acte, aucune parole, aucune pensée ne se produit hors de Son témoignage direct. *Ce témoignage servira de preuve irréfutable le Jour du Jugement, plus fiable que n'importe quel témoin humain.*\n\n---\n\n> 🤲 Ces dix noms rassemblent majesté, générosité et amour véritable : la relation avec Allah n'est pas qu'une soumission craintive, elle est aussi faite de proximité et d'affection sincère."},{"title":"6️⃣ Les Noms d'Allah 51 à 60","content":"## 5️⃣1️⃣ Al-Haqq (الْحَقُّ) — La Vérité\nAllah est la seule Réalité absolue et permanente, alors que tout le reste est passager — Sa parole, Ses promesses, Son existence sont d'une vérité inébranlable. *Chercher la vérité dans la vie, c'est finalement se rapprocher de Celui qui EST la Vérité.*\n\n## 5️⃣2️⃣ Al-Wakil (الْوَكِيلُ) — Le Garant\nAllah prend en charge les affaires de celui qui place sa confiance en Lui, après que celui-ci ait fait tous les efforts nécessaires — comme un avocat de confiance à qui l'on remet entièrement un dossier. *Le vrai relâchement du stress vient de cette remise de confiance.*\n\n## 5️⃣3️⃣ Al-Qawiyy (الْقَوِيُّ) — Le Fort\nSa force est totale et jamais menacée de faiblesse ou d'épuisement, contrairement à toute force humaine, même la plus impressionnante. *Face à un sentiment d'impuissance, demander l'aide d'Al-Qawiyy rappelle que la vraie force est toujours disponible auprès de Lui.*\n\n## 5️⃣4️⃣ Al-Matin (الْمَتِينُ) — Le Ferme, l'Inébranlable\nSa puissance ne demande aucun effort pour s'exercer — alors qu'un humain fort se fatigue en soulevant une charge lourde, rien ne coûte le moindre effort à Allah. *C'est une force sans limite et sans fatigue possible.*\n\n## 5️⃣5️⃣ Al-Waliyy (الْوَلِيُّ) — Le Protecteur proche\nAllah est l'allié et le protecteur intime de ceux qui Le suivent sincèrement, prenant soin d'eux comme un proche véritable — pas une divinité lointaine et indifférente. *Cette proximité est accessible à chacun, quelle que soit sa condition sociale.*\n\n## 5️⃣6️⃣ Al-Hamid (الْحَمِيدُ) — Le Digne de louange\nAllah mérite d'être loué en toute circonstance, dans la joie comme dans l'épreuve — pas seulement quand tout va bien. *« Alhamdulillah » reste valable même face à une difficulté, car Sa sagesse derrière chaque situation mérite reconnaissance.*\n\n## 5️⃣7️⃣ Al-Muhsi (الْمُحْصِي) — Celui qui dénombre tout\nAllah connaît le nombre exact de toute chose — chaque grain de sable, chaque respiration, chaque action, sans exception. *Ce nom rappelle que rien n'est perdu dans l'oubli, même ce que l'humain lui-même a oublié.*\n\n## 5️⃣8️⃣ Al-Mubdi' (الْمُبْدِئُ) — L'Initiateur\nAllah a commencé la création sans aucun modèle préexistant — le tout premier acte créateur, sans précédent à imiter. *Ce nom souligne l'originalité absolue de l'acte créateur d'Allah, jamais copié de nulle part.*\n\n## 5️⃣9️⃣ Al-Mu'id (الْمُعِيدُ) — Celui qui refait, qui ressuscite\nDe même qu'Il a créé une première fois, Allah recréera chaque être après la mort — le cycle de la création initiale et de la résurrection finale Lui appartient entièrement. *Recommencer n'est jamais impossible pour Celui qui a déjà tout commencé une fois.*\n\n## 6️⃣0️⃣ Al-Muhyi (الْمُحْيِي) — Celui qui donne la vie\nAllah insuffle la vie à la matière inerte — des graines qui germent, un embryon qui se forme, un cœur qui reprend espoir après le désespoir. *Ce nom s'applique aussi bien à la vie physique qu'à la vitalité spirituelle d'un cœur endormi.*\n\n---\n\n> 🤲 Cette section met l'accent sur la confiance totale (tawakkul) à placer en un Allah véridique, fort et proche — une combinaison rare qui rassure autant qu'elle inspire le respect."},{"title":"7️⃣ Les Noms d'Allah 61 à 70","content":"## 6️⃣1️⃣ Al-Mumit (الْمُمِيتُ) — Celui qui donne la mort\nAllah ordonne la mort de chaque être vivant au moment précis qu'Il a fixé, sans qu'aucune force extérieure ne puisse l'avancer ou la retarder. *Ce nom apaise face à la peur de la mort : elle n'arrive jamais un instant avant ou après ce qui a été décidé.*\n\n## 6️⃣2️⃣ Al-Hayy (الْحَيُّ) — Le Vivant\nAllah possède une vie parfaite et éternelle, sans début ni fin, contrairement à toute vie créée qui naît et s'éteint. *C'est de cette Vie parfaite que découle toute autre forme de vie dans l'univers.*\n\n## 6️⃣3️⃣ Al-Qayyum (الْقَيّومُ) — Celui qui subsiste par Lui-même\nAllah n'a besoin de rien ni de personne pour exister, alors que tout l'univers dépend entièrement de Lui pour continuer à exister — comme un fil invisible qui maintient tout en place. *Ce nom, associé à Al-Hayy, forme le cœur du « Verset du Trône » (Ayat al-Kursi, Coran 2:255).*\n\n## 6️⃣4️⃣ Al-Wajid (الْوَاجِدُ) — Celui qui trouve tout\nAllah n'est jamais dans le manque ni dans la recherche — Il trouve et possède tout instantanément, sans effort ni attente. *Contrairement à l'humain toujours en quête de quelque chose, rien ne manque jamais à Al-Wajid.*\n\n## 6️⃣5️⃣ Al-Majid (الْمَاجِدُ) — Le Noble, l'Illustre\nCe nom souligne une noblesse et une générosité extraordinaires, unies à une grandeur incomparable — la combinaison rare de puissance et de bonté. *Un souverain terrestre puissant est rarement aussi généreux ; chez Allah, les deux coexistent parfaitement.*\n\n## 6️⃣6️⃣ Al-Wahid (الْوَاحِدُ) — L'Unique (numériquement Un)\nAllah est Un, sans associé, sans partenaire dans Sa royauté ni dans Son adoration — aucune divinité secondaire n'existe à côté de Lui. *C'est le cœur même du Tawhid, la profession de foi musulmane.*\n\n## 6️⃣7️⃣ Al-Ahad (الْأَحَدُ) — L'Unique (indivisible)\nProche d'Al-Wahid, ce nom insiste sur l'unicité absolue de l'essence divine : Allah ne se divise pas, ne se décompose pas, n'a pas de parties. *La sourate Al-Ikhlas commence justement par ce nom : « Dis : Il est Allah, Unique ».*\n\n## 6️⃣8️⃣ As-Samad (الصَّمَدُ) — L'Absolu, Celui dont tous dépendent\nToute la création a besoin d'Allah, alors que Lui n'a besoin d'absolument rien — Il n'a ni parent ni enfant, contrairement à toute créature. *Tous les besoins de l'univers convergent vers Lui, sans qu'aucun besoin ne remonte dans l'autre sens.*\n\n## 6️⃣9️⃣ Al-Qadir (الْقَادِرُ) — Le Capable\nAllah a le pouvoir total d'accomplir tout ce qu'Il veut, sans exception ni limite — rien n'est difficile pour Lui, même ce qui paraît impossible aux yeux des hommes. *Face à une situation qui semble sans issue, ce nom rappelle qu'Allah peut tout.*\n\n## 7️⃣0️⃣ Al-Muqtadir (الْمُقْتَدِرُ) — Le Tout-Puissant déterminant\nCe nom ajoute à Al-Qadir l'idée d'un pouvoir qui s'exerce avec une précision et une maîtrise parfaite sur les détails les plus fins de la création. *Rien n'échappe à cette maîtrise totale, du plus grand événement au plus infime détail.*\n\n---\n\n> 🤲 Cette section touche au cœur du Tawhid : Allah est l'Unique, Vivant, Autosuffisant, dont tout dépend sans qu'Il dépende de rien ni personne."},{"title":"8️⃣ Les Noms d'Allah 71 à 80","content":"## 7️⃣1️⃣ Al-Muqaddim (الْمُقَدِّمُ) — Celui qui avance, qui priorise\nAllah fait avancer qui Il veut, dans le rang, le temps, ou les circonstances — c'est Lui qui décide de l'ordre des choses, pas le hasard ni le seul mérite apparent. *Une opportunité qui arrive plus tôt que prévu peut être un signe de ce nom à l'œuvre.*\n\n## 7️⃣2️⃣ Al-Mu'akhkhir (الْمُؤَخِّرُ) — Celui qui retarde\nDe même, Allah retarde ce qu'Il veut selon Sa sagesse — un retard n'est jamais un oubli de Sa part, mais souvent une protection ou une préparation invisible. *Ce qui semble tarder trouve toujours son heure exacte fixée par Lui.*\n\n## 7️⃣3️⃣ Al-Awwal (الْأَوَّلُ) — Le Premier\nAllah existait avant toute chose, sans qu'il y ait eu de « avant Lui » — aucun commencement ne précède Son existence. *Ce nom dépasse totalement notre notion humaine de commencement, toujours relative à quelque chose d'antérieur.*\n\n## 7️⃣4️⃣ Al-Akhir (الْآخِرُ) — Le Dernier\nAllah restera après que toute la création aura disparu, sans qu'il y ait de « après Lui » — Il est la seule permanence absolue au-delà de toute fin. *Al-Awwal et Al-Akhir encadrent toute l'existence, avant et après tout ce qui existe.*\n\n## 7️⃣5️⃣ Az-Zahir (الظَّاهِرُ) — Le Manifeste\nSon existence est évidente à travers Ses signes dans l'univers — l'ordre précis de la création, la beauté de la nature, tout témoigne de Lui sans qu'on ait besoin de preuve compliquée. *Regarder attentivement le monde, c'est déjà voir des traces d'Az-Zahir.*\n\n## 7️⃣6️⃣ Al-Batin (الْبَاطِنُ) — Le Caché\nEn même temps, Son essence reste totalement inaccessible à la perception humaine — personne n'a jamais vu Allah ici-bas, ni ne peut Le comprendre pleinement. *Az-Zahir et Al-Batin révèlent un mystère fascinant : Il est à la fois évident et insaisissable.*\n\n## 7️⃣7️⃣ Al-Wali (الْوَالِي) — Le Gouverneur\nAllah gère et administre toutes les affaires de l'univers avec une autorité totale — rien ne se produit sans Sa gestion, même les détails les plus minimes. *Ce nom rassure : rien n'est laissé au hasard dans la gestion du monde.*\n\n## 7️⃣8️⃣ Al-Muta'ali (الْمُتَعَالِي) — Le Très-Exalté\nAllah est exalté au-delà de toute imperfection, de toute ressemblance avec la création, de toute limitation imaginable. *Même la meilleure description humaine reste toujours en dessous de Sa réalité.*\n\n## 7️⃣9️⃣ Al-Barr (الْبَرُّ) — La Source de tout bien\nTout bien qui existe dans l'univers provient originellement d'Allah, même quand il transite par un intermédiaire humain — celui qui fait le bien n'est qu'un canal, la source reste Al-Barr. *Cela pousse à remercier Allah même quand un bienfait vient visiblement d'une autre personne.*\n\n## 8️⃣0️⃣ At-Tawwab (التَّوَّابُ) — Celui qui accepte le repentir\nAllah revient constamment vers Son serviteur repentant, Lui-même facilitant le chemin du retour — le mot arabe implique un mouvement répété dans les deux sens. *Se repentir n'est jamais une démarche isolée : Allah fait aussi Sa part du chemin.*\n\n---\n\n> 🤲 Ces dix noms montrent un Allah qui gère le temps et les circonstances (avancer, retarder), tout en étant à la fois évident et mystérieux, source de tout bien et toujours prêt à accueillir le repentir."},{"title":"9️⃣ Les Noms d'Allah 81 à 90","content":"## 8️⃣1️⃣ Al-Muntaqim (الْمُنتَقِمُ) — Le Vengeur (justicier)\nAllah punit avec justice les tyrans et les injustes qui n'ont pas réparé leurs torts — pas par cruauté, mais par équité envers ceux qui ont été lésés. *Aucune injustice grave ne reste impunie éternellement, même si elle semble oubliée ici-bas.*\n\n## 8️⃣2️⃣ Al-'Afuww (الْعَفُوُّ) — Celui qui efface les fautes\nCe nom va plus loin que le simple pardon : Allah efface complètement la trace du péché, comme s'il n'avait jamais existé. *Contrairement au pardon humain qui laisse souvent une trace de mémoire, Al-'Afuww efface totalement.*\n\n## 8️⃣3️⃣ Ar-Ra'uf (الرَّؤوفُ) — Le Compatissant\nAllah témoigne une douceur et une compassion tendre, plus intime encore que la miséricorde générale d'Ar-Rahman — comme une tendresse rapprochée envers celui qui souffre. *Ce nom apparaît souvent lié à Ar-Rahim dans le Coran, renforçant cette proximité affectueuse.*\n\n## 8️⃣4️⃣ Malik-ul-Mulk (مَالِكُ الْمُلْكِ) — Le Maître du Royaume\nAllah donne et retire le pouvoir à qui Il veut, sur cette terre — les grands empires s'élèvent et s'effondrent entièrement selon Sa volonté. *Aucun pouvoir politique, aussi solide paraisse-t-il, n'échappe à cette règle.*\n\n## 8️⃣5️⃣ Dhul-Jalali wal-Ikram (ذُو الْجَلالِ وَالْإِكْرَامِ) — Le Détenteur de la Majesté et de la Générosité\nCe nom rassemble deux qualités rares ensemble : une majesté imposante et une générosité sans limite — la grandeur ne s'oppose jamais chez Lui à la bonté. *Beaucoup de savants recommandent de répéter ce nom en invocation, car il figure parmi les plus englobants.*\n\n## 8️⃣6️⃣ Al-Muqsit (الْمُقْسِطُ) — L'Équitable\nAllah rétablit l'équilibre et la justice partout où elle a été brisée — chaque droit spolié sera un jour restitué, même après la mort. *Ce nom donne espoir à celui qui n'a jamais obtenu justice ici-bas.*\n\n## 8️⃣7️⃣ Al-Jami' (الْجَامِعُ) — Celui qui rassemble\nAllah rassemblera toute la création, dispersée à travers les siècles et les continents, en un seul lieu au Jour du Jugement. *Rien n'est trop éparpillé ou trop lointain pour échapper à ce rassemblement final.*\n\n## 8️⃣8️⃣ Al-Ghani (الْغَنِيّ) — Celui qui se suffit à Lui-même\nAllah n'a besoin ni de l'adoration des hommes, ni de leurs biens, ni de rien de ce qu'ils possèdent — leur obéissance ne Lui ajoute rien, leur désobéissance ne Lui retire rien. *Cela rappelle que la pratique religieuse profite entièrement au serviteur, jamais à Allah.*\n\n## 8️⃣9️⃣ Al-Mughni (الْمُغْنِي) — Celui qui enrichit\nAllah accorde à qui Il veut une richesse suffisante, matérielle ou du cœur — la vraie richesse étant parfois celle de se contenter de peu. *Ce nom rassure celui qui traverse une période de manque : l'enrichissement peut venir sous des formes inattendues.*\n\n## 9️⃣0️⃣ Al-Mani' (الْمَانِعُ) — Celui qui empêche, qui protège\nAllah empêche ce qui pourrait nuire, souvent sans que Sa créature ne s'en rende même compte — un accident évité de justesse, une mauvaise décision finalement abandonnée. *Combien de malheurs évités ne seront jamais connus, protégés par Al-Mani' sans qu'on le sache ?*\n\n---\n\n> 🤲 Cette section équilibre justice ferme envers les tyrans et douceur envers les repentants, tout en rappelant qu'Allah n'a besoin de rien ni personne, contrairement à toute la création qui dépend entièrement de Lui."},{"title":"🔟 Les Noms d'Allah 91 à 99","content":"## 9️⃣1️⃣ Ad-Darr (الضَّارُّ) — Celui qui peut éprouver, avec sagesse\nAllah peut permettre une difficulté selon Sa sagesse, jamais par cruauté gratuite — souvent pour éprouver, faire grandir, ou détourner d'un mal plus grand encore. *Ce nom s'accompagne toujours d'Al-Muqaddim et d'An-Nafi' : la difficulté n'est jamais l'unique visage d'Allah.*\n\n## 9️⃣2️⃣ An-Nafi' (النَّافِعُ) — Celui qui est bénéfique\nAllah crée tout ce qui est utile et bénéfique — la médecine, la nourriture, le savoir, chaque bienfait tire son origine de Lui. *Ad-Darr et An-Nafi' ensemble rappellent qu'Allah seul dispose du mal et du bien, jamais une force extérieure indépendante.*\n\n## 9️⃣3️⃣ An-Nur (النُّورُ) — La Lumière\nAllah illumine les cieux et la terre, mais aussi les cœurs égarés dans l'obscurité du doute ou du péché — la sourate An-Nur (24:35) décrit cette lumière comme une niche contenant une lampe éclatante. *Demander la lumière d'Allah, c'est demander la clarté face à une situation confuse.*\n\n## 9️⃣4️⃣ Al-Hadi (الْهَادِي) — Le Guide\nAllah guide vers le droit chemin celui qui Le cherche sincèrement — pas par contrainte, mais en éclairant le cœur qui accepte d'être guidé. *C'est ce nom qu'on invoque à chaque prière dans la sourate Al-Fatiha : « Guide-nous sur le droit chemin ».*\n\n## 9️⃣5️⃣ Al-Badi' (الْبَدِيعُ) — L'Inventeur incomparable\nAllah crée de manière totalement originale, sans copier aucun modèle existant — chaque création, du plus petit atome à la plus grande galaxie, porte une signature unique. *Rien dans l'univers n'a été « inventé » par imitation chez Allah.*\n\n## 9️⃣6️⃣ Al-Baqi (الْبَاقِي) — L'Éternel\nAllah demeure pour toujours, sans jamais disparaître ni s'affaiblir avec le temps — contrairement à toute chose créée, condamnée à disparaître un jour. *Cette permanence contraste avec la nature éphémère de tout ce que l'homme construit ici-bas.*\n\n## 9️⃣7️⃣ Al-Warith (الْوَارِثُ) — L'Héritier\nAprès la disparition de toute création, tout reviendra à Allah, le seul véritable propriétaire final de tout ce qui existe. *Aucun bien accumulé sur terre n'est réellement permanent : tout retourne finalement à Al-Warith.*\n\n## 9️⃣8️⃣ Ar-Rashid (الرَّشِيدُ) — Le Guide droit\nAllah mène toute chose vers son but final avec une sagesse parfaite, sans jamais se tromper de direction — comme un guide de montagne qui connaît chaque sentier par cœur. *Se perdre dans la vie n'empêche pas Ar-Rashid de connaître le bon chemin à proposer.*\n\n## 9️⃣9️⃣ As-Sabur (الصَّبورُ) — Le Très Patient\nAllah ne se hâte jamais de punir, laissant à chacun le temps de se corriger — une patience qui n'est ni de la faiblesse ni de l'indifférence, mais un choix miséricordieux. *C'est ce nom qui explique pourquoi tant d'injustices visibles persistent encore un temps sans sanction immédiate.*\n\n---\n\n> 🤲 Cette dernière partie referme la liste sur une note d'espoir : même ce qui semble difficile a un sens, la lumière guide toujours ceux qui la cherchent, et la patience d'Allah laisse à chacun le temps de revenir vers Lui."}]},"quizzes":{"fondamentaux":[{"questions":[{"question":"Quel principe exprime l'unicité d'Allah ?","choices":["A. Tawhid","B. Shirk","C. Riba","D. Gharar"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Que signifie Ihsan, le sommet de la foi ?","choices":["A. Adorer Allah comme si on Le voyait","B. Réciter le Coran par cœur","C. Faire beaucoup d'aumônes","D. Jeûner tous les lundis"],"answer":"A","explanation":"Ihsan est décrit par le hadith de Jibril : adorer Allah comme si on Le voyait, et si on ne Le voit pas, savoir que Lui nous voit."},{"question":"Quelle est la règle de base entre le Halal et le Haram ?","choices":["A. Tout est interdit sauf exception explicite","B. La liberté est la règle, l'interdiction l'exception","C. Seuls les savants peuvent manger librement","D. Rien n'est jamais vraiment interdit"],"answer":"B","explanation":"Le cours pose ce principe de base : la liberté est la règle, l'interdiction est l'exception, avec le makruh et le mandub entre les deux."},{"question":"Combien d'étapes compte la Tawbah (le repentir) selon le cours ?","choices":["A. Une seule","B. Deux","C. Trois","D. Cinq"],"answer":"C","explanation":"Trois étapes : regretter sincèrement, arrêter le péché, décider de ne pas y retourner."},{"question":"Les intentions ont-elles une importance dans les actes ?","choices":["A. Non","B. Oui","C. Seulement au Hajj","D. Seulement pour les savants"],"answer":"B","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Où Muhammad ﷺ est-il né ?","choices":["A. Médine","B. La Mecque","C. Damas","D. Taïf"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel événement donne son nom au calendrier hégirien ?","choices":["A. Badr","B. L’Hégire","C. La conquête de La Mecque","D. La naissance du Prophète"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Comment s'appelle la période préislamique en Arabie ?","choices":["A. Jahiliyya","B. Abbassides","C. Renaissance","D. Omeyyades"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Où commence la première révélation ?","choices":["A. Médine","B. Grotte de Hira","C. Taïf","D. Arafat"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle ville devient le centre de la première communauté musulmane après l’Hégire ?","choices":["A. Damas","B. Médine","C. Jérusalem","D. Bassora"],"answer":"B","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien de prières obligatoires quotidiennes ?","choices":["A. 3","B. 4","C. 5","D. 7"],"answer":"C","explanation":"Réponse conforme au cours correspondant."},{"question":"Fajr correspond à :","choices":["A. L’aube","B. Midi","C. Après-midi","D. Nuit"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle direction vise-t-on dans la Salat ?","choices":["A. Nord","B. Qibla","C. Est","D. Sud"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Après avoir perdu ses ablutions, que faut-il faire avant la prière ?","choices":["A. Rien","B. Renouveler le wudu","C. Jeûner","D. Donner une sadaqa"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Que s'est-il passé lors de l'Isra wa Mi'raj concernant le nombre de prières quotidiennes ?","choices":["A. Elles sont passées de 50 à 5, récompensées comme 50","B. Elles sont passées de 5 à 50","C. Elles ont été totalement supprimées","D. Rien n'a changé ce jour-là"],"answer":"A","explanation":"Allah avait initialement prescrit 50 prières ; après plusieurs allers-retours de Muhammad ﷺ auprès de Musa ﷺ, elles sont ramenées à 5, mais récompensées comme 50."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien de sourates compte le Coran ?","choices":["A. 100","B. 114","C. 120","D. 124"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Dans quelle langue le Coran a-t-il été révélé ?","choices":["A. Latin","B. Arabe","C. Hébreu","D. Araméen"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle sourate ouvre le Mushaf ?","choices":["A. Al-Baqara","B. Al-Fatiha","C. An-Nas","D. Al-Ikhlas"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Combien de temps a duré la révélation progressive du Coran ?","choices":["A. Environ 23 ans","B. Une seule nuit","C. 10 ans","D. 40 ans"],"answer":"A","explanation":"La révélation s'est déroulée progressivement pendant environ 23 ans, pour accompagner les croyants et répondre à différentes situations."},{"question":"Pour les musulmans, le Coran est :","choices":["A. Une œuvre humaine","B. La parole d’Allah","C. Un livre historique seulement","D. Une tradition orale"],"answer":"B","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien de piliers compte l’Islam ?","choices":["A. 4","B. 5","C. 6","D. 7"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel est le premier pilier ?","choices":["A. Hajj","B. Shahada","C. Zakat","D. Sawm"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel pilier concerne l’aumône obligatoire ?","choices":["A. Shahada","B. Zakat","C. Hajj","D. Sawm"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel pilier concerne le jeûne de Ramadan ?","choices":["A. Sawm","B. Zakat","C. Hajj","D. Salat"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel pilier concerne le pèlerinage ?","choices":["A. Hajj","B. Salat","C. Zakat","D. Shahada"],"answer":"A","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien de piliers de la foi ?","choices":["A. 4","B. 5","C. 6","D. 7"],"answer":"C","explanation":"Réponse conforme au cours correspondant."},{"question":"Croire en Allah fait-il partie des piliers ?","choices":["A. Oui","B. Non","C. Seulement pour les savants","D. Seulement au Ramadan"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Croire aux anges fait-il partie de la foi ?","choices":["A. Oui","B. Non","C. Uniquement Jibril","D. Uniquement Mika’il"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Le Jour dernier fait-il partie des piliers de la foi ?","choices":["A. Oui","B. Non","C. Seulement pour les prophètes","D. Seulement après la mort"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Le Qadar fait-il partie des six piliers ?","choices":["A. Oui","B. Non","C. Seulement pour certains musulmans","D. Seulement pendant Ramadan"],"answer":"A","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien de portes du Paradis sont citées ?","choices":["A. 5","B. 7","C. 8","D. 10"],"answer":"C","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle porte est associée à ceux qui jeûnent ?","choices":["A. Ar-Rayyan","B. Al-Firdaws","C. Badr","D. Jibril"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Les portes du Paradis sont-elles liées aux œuvres ?","choices":["A. Oui","B. Non","C. Seulement au Hajj","D. Seulement au Ramadan"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Un croyant peut-il être appelé par plusieurs portes selon ses œuvres ?","choices":["A. Oui","B. Non","C. Jamais","D. Seulement s’il est savant"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle attitude générale est encouragée ?","choices":["A. Multiplier les bonnes œuvres","B. Négliger les œuvres","C. Chercher la célébrité","D. Éviter l’adoration"],"answer":"A","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Comment appelle-t-on les compagnons du Prophète ﷺ ?","choices":["A. Sahaba","B. Tabi’in","C. Fuqaha","D. Muhaddithun"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Qui est le premier calife ?","choices":["A. Umar","B. Abu Bakr","C. Uthman","D. Ali"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Qui est le deuxième calife ?","choices":["A. Ali","B. Umar ibn al-Khattab","C. Uthman","D. Bilal"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Bilal رضي الله عنه est notamment connu pour :","choices":["A. L’appel à la prière","B. Être prophète","C. Être roi","D. Être un ange"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle attitude envers les compagnons est recommandée ?","choices":["A. Les mépriser","B. Les respecter","C. Les considérer comme prophètes","D. Les ignorer"],"answer":"B","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Que signifie littéralement dire \"Bismillah\" avant une action ?","choices":["A. Un rappel que rien ne se fait sans la permission d'Allah","B. Une formule porte-bonheur","C. Une excuse pour éviter de s'engager","D. Une simple habitude sans signification"],"answer":"A","explanation":"Bismillah n'est pas une formule porte-bonheur : c'est un rappel, à chaque nouvelle action, que rien ne se fait vraiment sans la permission d'Allah."},{"question":"Dans quelle situation dit-on \"Alhamdulillah\", selon le cours ?","choices":["A. Uniquement après un grand succès","B. Après avoir mangé, reçu une bonne nouvelle, ou même après un éternuement","C. Uniquement à la mosquée","D. Seulement le vendredi"],"answer":"B","explanation":"La gratitude islamique ne s'exprime pas seulement dans les situations exceptionnelles — elle s'exprime aussi dans des moments neutres du quotidien."},{"question":"Que fait la formule \"SubhanAllah\" face à quelque chose de beau ?","choices":["A. Elle redirige l'admiration vers le Créateur","B. Elle exprime la tristesse","C. Elle sert à saluer quelqu'un","D. Elle s'utilise uniquement en cas de danger"],"answer":"A","explanation":"Au lieu de s'arrêter à « c'est beau », cette formule redirige immédiatement l'admiration vers Celui qui a rendu la beauté possible."},{"question":"Quand dit-on \"Astaghfirullah\", selon le cours ?","choices":["A. Après une erreur, ou en routine régulière","B. Uniquement le jour de l'Aïd","C. Pour remercier quelqu'un","D. Avant de voyager uniquement"],"answer":"A","explanation":"C'est une action concrète — demander pardon tout de suite, sans attendre un moment jugé plus solennel."},{"question":"Que signifie \"La hawla wa la quwwata illa billah\" ?","choices":["A. Il n'y a de force ni de puissance qu'en Allah","B. Allah est le plus grand","C. Je me réfugie auprès d'Allah","D. Que la paix soit sur vous"],"answer":"A","explanation":"Dite dans la difficulté, c'est un aveu — pas une défaite : reconnaître qu'on ne contrôle pas tout est le premier pas vers un vrai apaisement."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Quel est le principe central concernant Allah ?","choices":["A. Il est unique","B. Il a des associés","C. Il est humain","D. Il dépend de la création"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quels sont les 3 piliers qui doivent coexister dans la relation du croyant avec Allah ?","choices":["A. L'amour, la crainte révérencielle et l'espoir","B. La richesse, la santé et le pouvoir","C. Le jeûne, le Hajj et la Zakat","D. La colère, la peur et le doute"],"answer":"A","explanation":"Al-Mahabbah (l'amour), Al-Khawf (la crainte révérencielle) et Ar-Raja' (l'espoir) doivent coexister — sans les trois ensemble, la relation se déséquilibre."},{"question":"Peut-on comparer Allah à Ses créatures ?","choices":["A. Oui","B. Non","C. Seulement dans la prière","D. Toujours"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel nom signifie Le Tout Miséricordieux ?","choices":["A. Ar-Rahman","B. Al-Malik","C. Al-Hakim","D. Al-Ghafur"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel acte exprime le Tawhid ?","choices":["A. Adorer Allah seul","B. Adorer plusieurs intermédiaires","C. Adorer les astres","D. Adorer les anges"],"answer":"A","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Face à une question religieuse nouvelle en France, que faut-il faire ?","choices":["A. Suivre une rumeur","B. Chercher un avis qualifié et contextualisé","C. Tout interdire","D. Tout autoriser"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Le mariage civil apporte principalement :","choices":["A. Une protection juridique","B. Une nouvelle prière","C. Un statut prophétique","D. Une récompense automatique"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Les horaires de prière dépendent-ils de la ville ?","choices":["A. Oui","B. Non","C. Seulement le vendredi","D. Seulement en hiver"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Une difficulté professionnelle liée à la prière peut-elle être discutée avec l’employeur ?","choices":["A. Oui","B. Non","C. Jamais","D. Seulement au Ramadan"],"answer":"A","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel principe est recommandé face à l’incertitude ?","choices":["A. Trancher seul","B. Demander conseil à une personne compétente","C. Suivre les réseaux sociaux","D. Ne "D. Le fait de lever les mains"],"answer":"B","explanation":"Se précipiter et perdre patience est justement ce que le Prophète ﷺ a mis en garde contre, pas la langue utilisée ni la répétition."},{"question":"Parmi ces moments, lequel n'est PAS cité comme particulièrement propice à la dou'a ?","choices":["A. Le dernier tiers de la nuit","B. Pendant la prosternation (sujud)","C. Juste avant l'appel à la prière (adhan)","D. Au moment de rompre le jeûne"],"answer":"C","explanation":"Le moment propice se situe entre l'adhan et l'iqama, pas avant l'adhan lui-même."},{"question":"Quelles sont les trois invocations que rien ne repousse, selon le hadith ?","choices":["A. Celle de l'imam, celle du muezzin, celle du savant","B. Celle du voyageur, du malade, de la personne opprimée","C. Celle des parents, des enfants, des époux","D. Celle du riche, du pauvre, du voyageur"],"answer":"B","explanation":"Le voyageur, le malade et l'opprimé : trois invocations dont l'exaucement est assuré selon la tradition prophétique."},{"question":"Pourquoi l'alimentation illicite (haram) est-elle citée comme un obstacle à l'exaucement de la dou'a ?","choices":["A. Parce qu'elle rend la prière invalide automatiquement","B. Ce n'est qu'une légende populaire sans fondement","C. Le Prophète ﷺ l'a expressément citée comme une cause qui éloigne l'exaucement","D. Elle ne concerne que le jeûne, pas la dou'a"],"answer":"C","explanation":"Le Prophète ﷺ a décrit l'exemple d'un homme qui invoque longuement les mains levées, mais dont l'invocation a peu de chance d'être exaucée à cause de sa nourriture, sa boisson et son habillement illicites."}]}],"prophetes":[{"questions":[{"question":"Quelle différence générale est présentée entre prophète et messager ?","choices":["A. Il n'y a jamais de différence","B. Le messager est envoyé avec une mission/legislation particulière","C. Le prophète est toujours roi","D. Le messager n'est jamais humain"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Combien de prophètes sont cités nommément dans le Coran ?","choices":["A. 10","B. 25","C. 40","D. 124 000"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quelle croyance fait partie des piliers de la foi ?","choices":["A. Croire aux anges uniquement","B. Croire aux prophètes","C. Croire aux rois","D. Croire aux civilisations anciennes"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Les musulmans doivent-ils croire en certains prophètes et en rejeter d'autres ?","choices":["A. Oui","B. Non, ils croient aux prophètes d'Allah","C. Seulement aux prophètes arabes","D. Seulement à Muhammad ﷺ"],"answer":"B","explanation":"Réponse conforme au cours correspondant."},{"question":"Quel est le dernier prophète selon l'Islam ?","choices":["A. Musa ﷺ","B. Isa ﷺ","C. Muhammad ﷺ","D. Ibrahim ﷺ"],"answer":"C","explanation":"Réponse conforme au cours correspondant."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Qui refuse de se prosterner devant Adam ﷺ, et pourquoi ?","choices":["A. Hawa, par jalousie","B. Jibril, par timidité","C. Aucun ange n'a refusé","D. Iblis, par orgueil"],"answer":"D","explanation":"Iblis refuse, s'estimant supérieur car créé de feu plutôt que d'argile."},{"question":"Quelle est la vraie différence entre la faute d'Adam ﷺ et celle d'Iblis ?","choices":["A. Il n'y a aucune différence","B. Iblis s'est repenti, pas Adam","C. Adam ﷺ n'a commis aucune faute","D. Adam ﷺ s'est repenti sincèrement, Iblis a persisté dans son refus"],"answer":"D","explanation":"La réaction après la faute fait toute la différence."},{"question":"Combien d'interdictions Adam ﷺ et Hawa avaient-ils au Paradis ?","choices":["A. Cent","B. Dix","C. Aucune","D. Une seule (un arbre)"],"answer":"D","explanation":"Une seule règle, sur toute l'immensité du Paradis."},{"question":"Quel drame survient entre les fils d'Adam ﷺ, Qabil et Habil ?","choices":  L'agriculture","D. La médecine"],"answer":"A","explanation":"Idris ﷺ devient, selon la tradition, le premier à écrire au calame et le premier à coudre des vêtements — un vrai pionnier de la civilisation."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"Combien d'années Nuh ﷺ a-t-il prêché selon le Coran ?","choices":["A. 40 ans","B. 23 ans","C. 100 ans","D. 950 ans"],"answer":"D","explanation":"950 années de prédication."},{"question":"Pourquoi le fils de Nuh ﷺ, Kan'an, se noie-t-il ?","choices":["A. Il était à bord mais tombe accidentellement","B. Il refuse de monter sur l'arche, comptant sur une montagne pour se sauver","C. Il était malade","D. Il ne savait pas nager"],"answer":"B","explanation":"Il refuse la foi de son père et cherche refuge ailleurs."},{"question":"Que révèle Allah à Nuh ﷺ à propos de son fils ?","choices":["A. Qu'il sera sauvé malgré tout","B. Qu'il deviendra prophète à son tour","C. Rien de particulier","D. Qu'il n'est pas de sa famille, au sens de la foi"],"answer":"D","explanation":"Le lien de foi prime sur le lien du sang."},{"question":"Où se pose l'arche après le déluge ?","choices":["A. Le mont Sinaï","B. La Mecque","C. Le mont Arafat","D. Le mont Judi"],"answer":"D","explanation":"Sur le mont Judi."},{"question":"Quel surnom est donné à Nuh ﷺ dans ce cours ?","choices":["A. Kalimullah","B. Khalilullah","C. Shaykh al-Anbiya","D. Ruhullah"],"answer":"C","explanation":"Le Doyen des prophètes."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"À quel peuple Hud ﷺ est-il envoyé ?","choices":["A. Sodome","B. Madian","C. 'Ad","D. Thamud"],"answer":"C","explanation":"Le peuple de 'Ad."},{"question":"Comment ce peuple réagit-il à l'avertissement de Hud ﷺ ?","choices":["A. Ils se repentent immédiatement","B. Ils l'accueillent en héros","C. Ils raillent et défient Allah d'envoyer le châtiment","D. Ils l'ignorent sans réaction"],"answer":"C","explanation":"Ils défient Allah en comptant sur leur force."},{"question":"Par quoi le peuple de 'Ad est-il finalement anéanti ?","choices":["A. Un déluge","B. Une pluie de pierres","C. Un tremblement de terre","D. Un vent dévastateur de 7 nuits et 8 jours"],"answer":"D","explanation":"Un vent d'une violence inouïe."},{"question":"Hud ﷺ fait partie de quelle catégorie rare de prophètes ?","choices":["A. Les 5 Ulu al-'Azm","B. Les prophètes rois","C. Les prophètes arabes","D. Les prophètes nés sans père"],"answer":"C","explanation":"Il fait partie des rares prophètes arabes cités dans le Coran."},{"question":"Quelle question de Hud ﷺ reste actuelle aujourd'hui ?","choices":["A. Où se trouve l'eau ?","B. Combien de temps allez-vous vivre ?","C. Qui est votre roi ?","D. Vos idoles peuvent-elles vous nuire ou vous profiter ?"],"answer":"D","explanation":"La question s'applique aussi aux idoles modernes."}],"result":"Quiz terminé — relis le cours pour approfondir les réponses."},{"questions":[{"question":"À quel peuple Salih ﷺ est-il envoyé ?","choices":["A. Bani Isra'il","B. 'Ad","C. Madian","D. Thamud"],"answer":"D","explanation":"Le peuple de Thamud."},{"question":"Quel miracle Allah accorde-t-Il pour éprouver ce peuple ?","choices":["A. Une source d'eau","B. Un livre tombé du ciel","C. Une chamelle surgie du rocher","D. Une pluie de nourriture"],"answer":"C","explanation":"Une chamelle miraculeuse."},{"question":"Pourquoi l'abattage de la chamelle est-il si grave ?","choices":["A. C'était un accident","B. Ce n'était pas si grave","C. Ils avaient faim","D. C'était un défi conscient envers Allah"],"answer":"D","explanation":"C'était un acte délibéré de défi."},{"question":"Combien de jours de sursis Salih ﷺ leur donne-t-il ?","choices":["A. 40 jours","B. 7 jours","C. 1 jour","D. 3 jours"],"answer":"D","explanation":"Trois jours, une dernière fenêtre de miséricorde."},{"question":"Que sont devenues les demeures du peuple de Thamud ?","choices":["A. Une ville moderne","B le entre Ar-Rahman et Ar-Rahim ?","choices":["A. Ce sont deux noms totalement identiques sans nuance","B. Ar-Rahman concerne les anges, Ar-Rahim les humains","C. Ar-Rahman = miséricorde générale pour toute la création ; Ar-Rahim = miséricorde spécifique aux croyants","D. Ar-Rahim est utilisé uniquement dans la prière"],"answer":"C","explanation":"Ar-Rahman englobe toute la création sans distinction, comme le soleil ; Ar-Rahim est réservée de manière particulière aux croyants."},{"question":"Pourquoi le nom Al-Malik rappelle-t-il quelque chose d'important sur les rois de ce monde ?","choices":["A. Parce que les rois humains sont aussi appelés Al-Malik dans le Coran","B. Parce qu'aucun roi humain ne possède réellement quoi que ce soit — tout appartient à Allah","C. Parce que ce nom interdit toute forme de monarchie","D. Parce que ce nom ne concerne que l'au-delà"],"answer":"B","explanation":"Al-Malik rappelle que la propriété et le pouvoir des rois humains ne sont que temporaires et délégués, l'unique vrai Souverain étant Allah."},{"question":"Le nom As-Salam est lié à quel autre concept cité dans le cours ?","choices":["A. Dar as-Salam, la demeure de la paix (le Paradis)","B. Le jour du Jugement uniquement","C. La guerre licite en Islam","D. Le nom d'un ange"],"answer":"A","explanation":"Le Paradis est appelé « Dar as-Salam », la demeure de la paix, en lien direct avec ce nom d'Allah."},{"question":"Pourquoi l'orgueil est-il interdit à l'être humain, en lien avec le nom Al-Mutakabbir ?","choices":["A. Parce que l'orgueil est fatiguant socialement","B. Parce que la grandeur absolue n'appartient qu'à Allah, se sentir supérieur revient à usurper cet attribut","C. Parce que Al-Mutakabbir signifie « l'humble »","D. Il n'y a pas de lien entre les deux"],"answer":"B","explanation":"Seul Allah a droit à une grandeur absolue ; l'humain qui s'en réclame usurpe un attribut divin."},{"question":"Le nom Al-Jabbar a deux facettes. Lesquelles ?","choices":["A. Celui qui punit et celui qui récompense","B. Celui qui crée et celui qui détruit","C. Celui qui contraint Sa création à Sa volonté, et Celui qui répare ce qui est brisé","D. Celui qui pardonne et celui qui oublie"],"answer":"C","explanation":"Al-Jabbar rassemble la contrainte souveraine sur toute la création et la réparation de ce qui semble irrémédiablement brisé."}]},{"questions":[{"question":"Qu'est-ce qui distingue Al-Khaliq de tout créateur humain ?","choices":["A. Il utilise des matériaux plus rares","B. Il crée à partir du néant, sans modèle ni effort, par un simple ordre","C. Il ne crée que des êtres vivants","D. Il a besoin de temps pour créer"],"answer":"B","explanation":"Contrairement à l'humain qui transforme une matière existante, Allah crée du néant par le simple ordre « Sois »."},{"question":"Le nom Al-Ghaffar insiste particulièrement sur quelle idée ?","choices":["A. Le pardon accordé une seule fois dans la vie","B. Le pardon répété, encore et encore, sans lassitude","C. Le pardon réservé uniquement aux savants","D. L'absence totale de péché chez le croyant"],"answer":"B","explanation":"Al-Ghaffar souligne la répétition du pardon, même face aux mêmes fautes revenant plusieurs fois."},{"question":"Pourquoi le nom Al-Qahhar est-il rassurant face à une injustice subie ?","choices":["A. Parce qu'il garantit une réparation financière","B. Parce que même l'oppresseur le plus puissant reste totalement soumis à Allah","C. Parce qu'il annule automatiquement toute injustice","D. Il n'a aucun rapport avec l'injustice"],"answer":"B","explanation":"Aucun tyran, aussi puissant soit-il, n'échappe à la domination totale d'Allah."},{"question":"Que signifie concrètement le nom Al-Musawwir dans ta propre existence ?","choices":["A. Ta forme et ton apparence sont le fruit du hasard génétique uniquement","B. Ta forme unique est un choix précis d'Allah, comme pour chaque être humain","C. Ce nom ne concerne que les animaux","D. Il désigne uniquement la création des anges"],"answer":"B","explanation":"Al-Musawwir donne à chaque créature sa forme unique et précise, y compris la tienne."},{"question":"Une période difficile de resserrement (Al-Qabid) signifie-t-elle forcément une colère divine ?","choices":["A. Oui, toujours","B. Non, elle peut cacher une sagesse ou une épreuve, pas systématiquement une punition","C. Cela ne concerne que les non-croyants","D. Ce nom n'a aucun lien avec les épreuves"],"answer":"B","explanation":"Le resserrement peut relever d'une sagesse ou d'une épreuve, pas forcément d'une punition."}]},{"questions":[{"question":"Al-Basit est l'opposé de quel autre nom ?","choices":["A. Al-Malik","B. Al-Qabid","C. Al-Latif","D. As-Sami'"],"answer":"B","explanation":"Al-Basit (celui qui étend) est l'opposé d'Al-Qabid (celui qui restreint), vus dans la partie précédente."},{"question":"D'après le cours, la vraie élévation accordée par Ar-Rafi' dépend surtout de quoi ?","choices":["A. De la richesse et de la popularité","B. De la piété du cœur, pas des critères habituels du monde","C. Du niveau d'études","D. De l'âge de la personne"],"answer":"B","explanation":"L'élévation véritable auprès d'Allah suit la piété du cœur, souvent invisible aux yeux du monde."},{"question":"Que rappellent ensemble les noms Al-Mu'izz et Al-Mudhill ?","choices":["A. Que l'honneur dépend uniquement du statut social","B. Que l'honneur véritable ne dépend jamais des hommes, mais d'Allah seul","C. Qu'ils concernent uniquement les rois","D. Que l'honneur est acquis une fois pour toutes"],"answer":"B","explanation":"Allah seul accorde ou retire l'honneur véritable, indépendamment des standards humains."},{"question":"Quelle différence fait le cours entre As-Sami' et Al-Basir ?","choices":["A. As-Sami' entend tout, y compris les plaintes silencieuses ; Al-Basir voit tout, y compris les gestes les plus discrets","B. Les deux noms sont parfaitement synonymes","C. As-Sami' concerne uniquement la prière","D. Al-Basir ne concerne que les anges"],"answer":"A","explanation":"As-Sami' couvre l'ouïe absolue (même le silence du cœur), Al-Basir couvre la vue absolue (même l'intime)."},{"question":"Selon Al-'Adl, que dit le Coran (An-Nisa 4:40) au sujet de la justice d'Allah ?","choices":["A. Il lèse parfois les gens pour les éprouver","B. Il ne lèse personne, même du poids d'un atome","C. La justice divine ne s'applique qu'au jour du Jugement","D. Seuls les croyants bénéficient de Sa justice"],"answer":"B","explanation":"Le Coran affirme qu'Allah ne lèse personne, pas même du poids d'un atome."}]},{"questions":[{"question":"Que signifie concrètement le nom Al-Khabir ?","choices":["A. Allah connaît uniquement les actions visibles","B. Allah connaît la réalité profonde des choses, y compris les intentions cachées","C. Ce nom concerne uniquement les prophètes","D. Allah ignore les motivations humaines"],"answer":"B","explanation":"Contrairement aux apparences trompeuses pour l'humain, Al-Khabir connaît la réalité profonde, y compris les intentions."},{"question":"Pourquoi dit-on « Allahu Akbar » (« Allah est plus grand ») plutôt que « Allah est grand » ?","choices":["A. C'est une simple habitude linguistique sans signification","B. Parce qu'Il est toujours plus grand que tout ce à quoi on pourrait Le comparer","C. Parce que la grammaire arabe l'exige","D. Cela n'a aucun lien avec le nom Al-Kabir"],"answer":"B","explanation":"« Akbar » est un comparatif : Allah est toujours plus grand que toute chose imaginable, jamais égalé par une comparaison fixe."},{"question":"Combien de fois une bonne action peut-elle être multipliée, selon le Coran cité pour Ash-Shakur ?","choices":["A. 10 fois","B. 100 fois","C. 700 fois","D. 1000 fois"],"answer":"C","explanation":"La sourate Al-Baqara (2:261) évoque une multiplication jusqu'à 700 fois pour une bonne action sincère."},{"question":"La formule « Hasbunallah wa ni'mal wakil » est directement tirée de quel nom ?","choices":["A. Al-Hasib","B. Al-Halim","C. Al-Ghafur","D. Al-Muqit"],"answer":"A","explanation":"Al-Hasib rassemble l'idée qu'Allah suffit entièrement à celui qui Lui fait confiance."},{"question":"Pourquoi Al-Halim est-il comparé à un professeur patient dans le cours ?","choices":["A. Parce qu'Il enseigne directement le Coran","B. Parce qu'Il retarde le châtiment malgré la désobéissance, laissant une chance de se corriger","C. Parce qu'Il punit immédiatement chaque erreur","D. Ce nom ne concerne pas la patience"],"answer":"B","explanation":"Comme un professeur patient, Al-Halim laisse le temps de se corriger avant toute conséquence."}]},{"questions":[{"question":"Selon les savants, combien de formes peut prendre la réponse d'Al-Mujib à une invocation ?","choices":["A. Une seule : obtenir exactement ce qu'on demande","B. Trois : obtenir la demande, voir un mal évité, ou une récompense gardée pour l'au-delà","C. Deux : acceptée ou refusée sans nuance","D. Aucune réponse n'est garantie"],"answer":"B","explanation":"La réponse peut prendre trois formes différentes, toutes considérées comme un exaucement réel."},{"question":"Pourquoi la crainte d'Allah liée au nom Al-Jalil n'est-elle pas de la terreur ?","choices":["A. Parce qu'Allah ne mérite aucun respect particulier","B. Parce que c'est un respect mesuré par Sa majesté, mêlant crainte et amour","C. Parce que ce nom n'a aucun lien avec la crainte","D. Parce que seule la terreur est appropriée face à Allah"],"answer":"B","explanation":"Al-Jalil inspire un respect profond qui mêle crainte et amour, pas une terreur aveugle."},{"question":"Que rappelle le nom Al-Wadud sur la nature de la religion ?","choices":["A. Qu'elle n'est faite que d'obligations et de crainte","B. Qu'elle inclut aussi une véritable relation d'amour réciproque","C. Que l'amour n'a aucune place en Islam","D. Que ce nom concerne uniquement les anges"],"answer":"B","explanation":"Al-Wadud rappelle que la religion comprend aussi une dimension d'amour sincère et réciproque."},{"question":"Pourquoi le nom Al-Ba'ith donne-t-il un sens particulier à la mort ?","choices":["A. Parce qu'il prouve que la mort est une fin définitive","B. Parce qu'Allah, qui a créé une première fois, peut recréer : la mort n'est qu'une étape avant un nouveau départ","C. Ce nom ne concerne pas la résurrection","D. Il s'applique uniquement aux prophètes"],"answer":"B","explanation":"Celui qui a créé la première fois peut ressusciter sans difficulté : la mort devient une transition, pas une fin."},{"question":"En quoi le témoignage d'Ash-Shahid est-il plus fiable qu'un témoignage humain ?","choices":["A. Parce qu'il concerne uniquement les grandes actions publiques","B. Parce qu'Allah est témoin direct de toute chose, en tout lieu et en tout temps, sans exception","C. Parce que les témoins humains mentent toujours","D. Ce nom n'a aucun lien avec le témoignage"],"answer":"B","explanation":"Contrairement à un témoin humain limité dans le temps et l'espace, Ash-Shahid témoigne de tout, partout, toujours."}]},{"questions":[{"question":"En quoi Al-Haqq est-il différent de tout le reste de l'existence ?","choices":["A. Il change constamment de forme","B. Il est la seule Réalité absolue et permanente, alors que tout le reste est passager","C. Ce nom désigne uniquement la vérité scientifique","D. Il n'a aucun rapport avec la réalité"],"answer":"B","explanation":"Contrairement à tout ce qui est créé et passager, Allah est la Vérité absolue et permanente."},{"question":"Le nom Al-Wakil fonctionne pleinement dans quel ordre d'actions ?","choices":["A. Se reposer entièrement sans rien faire d'abord","B. Faire tous les efforts nécessaires, PUIS remettre le résultat à Allah","C. Ne compter que sur ses propres forces","D. Ce nom n'a aucun lien avec l'effort humain"],"answer":"B","explanation":"Comme pour le Tawakkul (« attache ton chameau, PUIS fais confiance »), l'effort précède la remise de confiance à Al-Wakil."},{"question":"Pourquoi dit-on qu'« Alhamdulillah » reste valable même face à une épreuve, en lien avec Al-Hamid ?","choices":["A. Parce qu'il faut cacher sa tristesse","B. Parce qu'Allah mérite d'être loué en toute circonstance, pas seulement quand tout va bien","C. Ce nom ne concerne que les moments heureux","D. C'est une formule obligatoire sans lien avec le sens"],"answer":"B","explanation":"Al-Hamid est digne de louange en toute circonstance, y compris dans l'épreuve, car Sa sagesse y demeure."},{"question":"Que rappelle le nom Al-Muhsi à propos de ce que l'humain lui-même a oublié ?","choices":["A. Rien n'est jamais perdu dans l'oubli, Allah en garde le compte exact","B. Les oublis humains n'ont aucune importance pour Allah","C. Ce nom ne concerne que les grandes actions","D. Al-Muhsi ne compte que les péchés"],"answer":"A","explanation":"Al-Muhsi connaît le nombre exact de toute chose, y compris ce que l'humain a lui-même oublié."},{"question":"Quel est le lien entre Al-Mubdi' et Al-Mu'id ?","choices":["A. Ils sont totalement sans rapport","B. Al-Mubdi' a initié la création sans modèle ; Al-Mu'id recréera chaque être après la mort","C. Les deux ne concernent que les anges","D. Al-Mu'id précède Al-Mubdi' dans le temps"],"answer":"B","explanation":"Le cycle complet de la création (initiation) et de la résurrection (recommencement) est entièrement entre les mains d'Allah."}]},{"questions":[{"question":"Quels deux noms forment le cœur du « Verset du Trône » (Ayat al-Kursi) ?","choices":["A. Ar-Rahman et Ar-Rahim","B. Al-Hayy et Al-Qayyum","C. Al-Malik et Al-Quddus","D. Al-Awwal et Al-Akhir"],"answer":"B","explanation":"Al-Hayy (le Vivant) et Al-Qayyum (Celui qui subsiste par Lui-même) ouvrent le célèbre Ayat al-Kursi."},{"question":"Quelle sourate commence directement par le nom Al-Ahad ?","choices":["A. Al-Fatiha","B. Al-Ikhlas","C. Al-Baqara","D. Ya-Sin"],"answer":"B","explanation":"La sourate Al-Ikhlas débute par « Dis : Il est Allah, Unique (Ahad) »."},{"question":"Pourquoi As-Samad rassure-t-il face au sentiment de manque ?","choices":["A. Parce qu'Allah a aussi des besoins comme les créatures","B. Parce que toute la création dépend de Lui, alors que Lui n'a besoin de rien ni personne","C. Ce nom ne concerne pas la dépendance","D. Parce qu'Il dépend des anges pour subsister"],"answer":"B","explanation":"Tout converge vers Allah par besoin, mais Lui-même ne dépend d'absolument rien."},{"question":"Quelle est la nuance entre Al-Wahid et Al-Ahad ?","choices":["A. Il n'y a aucune différence, ce sont des synonymes stricts","B. Al-Wahid souligne l'unicité numérique (pas d'associé) ; Al-Ahad souligne l'indivisibilité de l'essence","C. Al-Wahid concerne les anges, Al-Ahad les prophètes","D. Al-Ahad est utilisé uniquement au pluriel"],"answer":"B","explanation":"Les deux noms se complètent : l'un insiste sur l'absence d'associé, l'autre sur l'indivisibilité totale."},{"question":"Pourquoi la mort n'arrive-t-elle jamais « au mauvais moment », selon Al-Mumit ?","choices":["A. Parce qu'elle est toujours prématurée","B. Parce qu'elle survient exactement au moment fixé par Allah, ni avant ni après","C. Parce que l'humain peut la retarder par ses efforts","D. Ce nom ne concerne pas le moment de la mort"],"answer":"B","explanation":"Aucune force extérieure ne peut avancer ou retarder la mort fixée par Allah."}]},{"questions":[{"question":"Que signifie « Al-Awwal » par rapport à notre notion humaine de commencement ?","choices":["A. C'est identique à un simple premier événement dans le temps","B. Cela dépasse totalement notre notion de commencement, car rien n'existait avant Lui","C. Cela signifie qu'Il est apparu au début de l'univers","D. Ce nom n'a aucun lien avec le temps"],"answer":"B","explanation":"Contrairement à tout commencement humain relatif à quelque chose d'antérieur, Al-Awwal n'a aucun « avant »."},{"question":"Quel mystère les noms Az-Zahir et Al-Batin révèlent-ils ensemble ?","choices":["A. Allah n'existe pas réellement","B. Il est à la fois évident à travers Ses signes et totalement insaisissable dans Son essence","C. Ces deux noms sont contradictoires et l'un annule l'autre","D. Seuls les savants peuvent Le percevoir"],"answer":"B","explanation":"Az-Zahir et Al-Batin coexistent : Ses signes sont visibles partout, mais Son essence reste inaccessible à la perception."},{"question":"Pourquoi remercier Allah même quand un bienfait vient visiblement d'une personne, en lien avec Al-Barr ?","choices":["A. Parce que la personne n'a jamais réellement aidé","B. Parce que la personne n'est qu'un canal, la source ultime de tout bien étant Allah","C. Ce n'est pas nécessaire, remercier la personne suffit","D. Ce nom ne concerne pas la gratitude"],"answer":"B","explanation":"Même transmis par un intermédiaire humain, tout bien provient originellement d'Al-Barr."},{"question":"Qu'implique le sens du mot arabe derrière At-Tawwab ?","choices":["A. Un pardon accordé une seule fois dans la vie","B. Un mouvement répété : Allah revient constamment vers le serviteur qui se repent","C. Il ne concerne que les grands péchés","D. At-Tawwab signifie « celui qui punit »"],"answer":"B","explanation":"La racine du mot implique un va-et-vient : Allah revient vers Son serviteur à chaque repentir sincère."},{"question":"Un retard dans la réalisation d'un souhait signifie-t-il forcément un oubli d'Allah, selon Al-Mu'akhkhir ?","choices":["A. Oui, toujours","B. Non, un retard n'est jamais un oubli, souvent une protection ou préparation invisible","C. Cela concerne uniquement les péchés","D. Ce nom n'a aucun rapport avec le temps"],"answer":"B","explanation":"Ce qui semble tarder trouve toujours son heure exacte fixée par la sagesse d'Allah."}]},{"questions":[{"question":"Quelle différence fait le cours entre Al-'Afuww et un simple pardon humain ?","choices":["A. Aucune différence, ce sont des synonymes","B. Al-'Afuww efface totalement la trace du péché, alors que le pardon humain laisse souvent une trace de mémoire","C. Al-'Afuww ne concerne que les petits péchés","D. Ce nom n'a aucun lien avec le pardon"],"answer":"B","explanation":"Al-'Afuww efface complètement, comme si le péché n'avait jamais existé, au-delà du simple pardon."},{"question":"Pourquoi aucun pouvoir politique ne peut-il échapper à Malik-ul-Mulk ?","choices":["A. Parce que les gouvernements sont tous corrompus","B. Parce qu'Allah donne et retire le pouvoir à qui Il veut, même aux plus grands empires","C. Ce nom ne concerne que les rois, pas les présidents","D. Il n'a aucun lien avec le pouvoir politique"],"answer":"B","explanation":"Aucun empire, aussi solide paraisse-t-il, n'échappe à la volonté de Malik-ul-Mulk."},{"question":"Pourquoi dit-on que la pratique religieuse profite au serviteur et non à Allah, en lien avec Al-Ghani ?","choices":["A. Parce qu'Allah a besoin de l'adoration des hommes pour exister","B. Parce qu'Allah Se suffit entièrement à Lui-même : l'obéissance ne Lui ajoute rien, la désobéissance ne Lui retire rien","C. Ce nom ne concerne pas la pratique religieuse","D. Al-Ghani signifie « celui qui a besoin des autres »"],"answer":"B","explanation":"Allah n'a besoin de rien de ce que font Ses serviteurs, contrairement à eux qui en profitent pleinement."},{"question":"Quel type de « protection invisible » illustre le nom Al-Mani' ?","choices":["A. Uniquement la protection contre les catastrophes naturelles","B. Des malheurs évités sans qu'on s'en rende même compte, comme un accident évité de justesse","C. Ce nom ne concerne que la protection physique visible","D. Al-Mani' n'agit qu'à la demande explicite"],"answer":"B","explanation":"Beaucoup de dangers évités restent totalement invisibles, protégés en silence par Al-Mani'."},{"question":"Que rassemble le nom Dhul-Jalali wal-Ikram ?","choices":["A. La force et la faiblesse","B. Une majesté imposante et une générosité sans limite, deux qualités rarement réunies chez l'humain","C. Uniquement la richesse matérielle","D. Il ne concerne que le Jour du Jugement"],"answer":"B","explanation":"Ce nom unit deux qualités qui s'opposent souvent chez l'humain : la grandeur et la bonté, parfaitement réunies chez Allah."}]},{"questions":[{"question":"Pourquoi Ad-Darr n'est-il jamais un signe de cruauté de la part d'Allah ?","choices":["A. Parce qu'Allah n'éprouve jamais personne","B. Parce que ce nom s'accompagne toujours d'An-Nafi' : la difficulté sert une sagesse, jamais une cruauté gratuite","C. Parce qu'il ne concerne que les mécréants","D. Ce nom n'a aucun lien avec les épreuves"],"answer":"B","explanation":"Ad-Darr et An-Nafi' fonctionnent ensemble : Allah seul dispose du mal et du bien, toujours avec sagesse."},{"question":"Dans quelle sourate invoque-t-on Al-Hadi à chaque prière ?","choices":["A. Al-Ikhlas","B. Al-Fatiha, avec « Guide-nous sur le droit chemin »","C. Al-Baqara","D. An-Nur"],"answer":"B","explanation":"La demande de guidance d'Al-Fatiha, récitée à chaque unité de prière, invoque directement ce nom."},{"question":"Que signifie le fait qu'Allah soit Al-Warith à propos des biens accumulés sur terre ?","choices":["A. Ils restent éternellement à leurs propriétaires","B. Aucun bien n'est réellement permanent : tout retourne finalement à Allah, le seul propriétaire final","C. Ce nom ne concerne que l'héritage familial","D. Il s'applique uniquement aux prophètes"],"answer":"B","explanation":"Après la disparition de toute création, tout revient à Al-Warith, le seul héritier véritable."},{"question":"Pourquoi certaines injustices semblent-elles persister un temps sans sanction immédiate, en lien avec As-Sabur ?","choices":["A. Parce qu'Allah est indifférent à l'injustice","B. Parce que Sa patience laisse à chacun le temps de se corriger, sans que cela signifie faiblesse","C. Parce que ce nom ne concerne pas la justice","D. Parce qu'Allah oublie parfois de punir"],"answer":"B","explanation":"La patience d'As-Sabur est un choix miséricordieux, jamais de l'indifférence ou de l'oubli."},{"question":"Que décrit la sourate An-Nur (24:35) au sujet de la lumière d'Allah ?","choices":["A. Une simple métaphore sans image précise","B. Une niche contenant function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inlineMd(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>')}
function md(t){let lines=String(t||'').split('\n'),out=[],i=0;while(i<lines.length){let x=lines[i];if(x.trim().startsWith('<table')){let tbl=[];while(i<lines.length&&!lines[i].includes('</table>')){tbl.push(lines[i]);i++}if(i<lines.length){tbl.push(lines[i]);i++}out.push('<div class="md-table-wrap">'+tbl.join('').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</div>');continue}if(x.startsWith('## '))out.push('<h2>'+inlineMd(x.slice(3))+'</h2>');else if(x.startsWith('### '))out.push('<h3>'+inlineMd(x.slice(4))+'</h3>');else if(x.startsWith('- '))out.push('<li>'+inlineMd(x.slice(2))+'</li>');else if(x.startsWith('> '))out.push('<blockquote>'+inlineMd(x.slice(2))+'</blockquote>');else if(x.trim()==='---')out.push('<hr>');else if(!x.trim())out.push('<div class="space"></div>');else out.push('<p>'+inlineMd(x)+'</p>');i++}return out.join('')}
