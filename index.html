\n- La taille apparente d'un obstacle — même l'homme le plus puissant du monde connu — ne compte pas face à la grandeur de Celui qui envoie la mission\n- La sincérité du repentir immédiat après une erreur, comme celle de Musa ﷺ après le meurtre accidentel, compte énormément\n- La mission prophétique exige une persévérance quasi inépuisable, répétée épreuve après épreuve\n\n---\n> 🤲 Musa ﷺ, le prophète le plus mentionné dans tout le Coran (136 fois), nous enseigne que la vraie force ne réside jamais dans les armées ni les trônes — mais dans une parole de vérité, dite avec constance au nom d'Allah."},{"title":"1️⃣6️⃣ Harun ﷺ — Le Frère Fidèle","content":"## 🙏 Un prophète nommé... à la demande d'un autre prophète\nVoici un fait unique dans toute la liste des 25 : Harun ﷺ devient prophète parce que son propre frère, Musa ﷺ, le demande explicitement à Allah avant même d'affronter le Pharaon : « Accorde-moi un assistant de ma famille, Harun mon frère... par lui, affermis mon dos. » (Coran, Sourate Ta-Ha, 20:29-31) Aucun autre prophète n'a été investi à la demande d'un autre.\n\n## 🗣️ Un soutien complémentaire, pas un second rôle mineur\nRéputé plus éloquent que Musa ﷺ, Harun ﷺ l'accompagne face au Pharaon, jouant un rôle de soutien essentiel — sans lui, la mission aurait été bien plus difficile à porter seul.\n\n## 🐄 Une épreuve terrible en l'absence de son frère\nPendant les 40 jours où Musa ﷺ se rend seul sur le mont Sinaï pour recevoir la Torah, Harun ﷺ reste en charge du peuple. Malgré tous ses avertissements, une partie du peuple sombre dans l'adoration d'un veau d'or, fabriqué par un homme du nom de Samiri. Impuissant à les en empêcher malgré ses mises en garde répétées, Harun ﷺ vit cette période comme une épreuve immense.\n\n## 😡 Une injustice encaissée avec calme\nÀ son retour, furieux de découvrir la scène, Musa ﷺ saisit injustement son frère par la barbe, le tenant pour responsable. Harun ﷺ ne réplique pas avec colère — il s'explique calmement, avec douceur, expliquant qu'il a fait tout ce qu'il pouvait sans provoquer une scission encore plus grave.\n\n## 💡 Ce que ce prophète t'apprend\n- Le rôle de soutien est noble en lui-même — on n'a pas besoin d'être le leader visible pour porter une mission essentielle\n- On ne peut jamais forcer la guidance de quelqu'un d'autre, même avec les meilleurs avertissements possibles\n- Répondre à la colère injuste par une explication calme et posée est une sagesse qui désamorce bien plus que la confrontation\n\n---\n> 🤲 Harun ﷺ, mort avant son frère Musa ﷺ, nous enseigne que la grandeur ne réside pas forcément dans le premier rôle — mais dans la fidélité totale à la mission qui nous a été confiée, quelle qu'elle soit."},{"title":"1️⃣7️⃣ Dawud ﷺ — Le Roi Prophète","content":"## 🐑 D'un simple berger à un roi\nDifficile d'imaginer un point de départ plus modeste : Dawud ﷺ était un simple berger. Puis vient l'affrontement contre le géant Jalut (Goliath) — Dawud ﷺ le terrasse d'un seul coup de fronde, un exploit qui semble impossible face à un guerrier surentraîné. Allah lui accorde ensuite un royaume entier, ainsi qu'une sagesse hors norme.\n\n## 🎵 Une voix si belle que la nature l'accompagne\nDawud ﷺ reçoit **Az-Zabur** (les Psaumes), et sa voix, en les récitant, est décrite comme si magnifique que montagnes et oiseaux se joignaient littéralement à lui en écho.\n\n## 🔨 Un roi qui travaille de ses propres mains\nDétail marquant : malgré son statut royal, Dawud ﷺ fabrique lui-même des armures, refusant de vivre uniquement des richesses de sa position. Le Prophète ﷺ a d'ailleurs dit que son jeûne — un jour sur deux — est le meilleur des jeûnes volontaires.\n\n## ⚖️ Une erreur de jugement, et un repentir immédiat\nUn jour, en tranchant trop rapidement un différend entre deux hommes sans entendre pleinement les deux parties, Dawud ﷺ réalise qu'Allah l'éprouvait sur sa rigueur de jugement. Sa réaction : il se prosterne immédiatement et se repent avec une sincérité totale — sans se chercher d'excuses.\n\n## 💡 Ce que ce prophète t'apprend\n- Même les rois-prophètes commettent des erreurs — ce qui compte n'est pas l'absence de faute, mais la rapidité et la sincérité du retour vers Allah\n- La justice exige toujours d'entendre toutes les parties avant de trancher, aussi pressé qu'on puisse être\n- Le travail manuel, même pour un roi, reste une noblesse — pas une contrainte à fuir une fois le pouvoir acquis\n\n---\n> 🤲 Dawud ﷺ, titré Khalifatullah et père de Sulayman ﷺ, nous enseigne que la grandeur d'un homme se mesure moins à l'absence d'erreurs qu'à la vitesse et la sincérité de son retour vers Allah quand il trébuche."},{"title":"1️⃣8️⃣ Sulayman ﷺ — Le Roi des Rois","content":"## 👑 Un royaume sans équivalent dans toute l'histoire prophétique\nFils de Dawud ﷺ, Sulayman ﷺ reçoit un pouvoir totalement hors norme : autorité sur les hommes, sur les djinns, sur les animaux, et même sur le vent lui-même. Aucun autre prophète, dans toute la tradition islamique, n'a reçu un royaume d'une telle ampleur.\n\n## 🐜 Comprendre le langage des créatures\nUn épisode célèbre le montre traversant une vallée avec son armée quand une fourmi avertit les siennes de se mettre à l'abri pour ne pas être écrasées. Sulayman ﷺ, qui comprend son langage, sourit — un exemple frappant de son don unique de communication avec toute la création.\n\n## 👸 Convertir une reine, sans une seule bataille\nFace à la reine Bilqis de Saba, Sulayman ﷺ ne recourt jamais à la force militaire. Il lui fait plutôt transporter son propre trône jusqu'à lui en un instant, puis lui montre un palais au sol si poli qu'il ressemble à de l'eau cristalline — une démonstration de puissance si impressionnante qu'elle finit par se convertir volontairement, sans qu'une seule flèche n'ait été tirée.\n\n## 🏛️ Le Temple bâti par les djinns\nSulayman ﷺ fait construire le Temple de Jérusalem grâce au travail des djinns placés sous son autorité — une prouesse architecturale rendue possible par un pouvoir qu'aucun roi humain ordinaire n'a jamais détenu.\n\n## 🪦 Une mort debout, personne ne s'en aperçoit\nDétail marquant de la tradition : Sulayman ﷺ meurt appuyé sur son bâton, en pleine posture debout — et personne autour de lui ne s'en rend compte immédiatement, tant sa présence physique paraissait normale.\n\n## 💡 Ce que ce prophète t'apprend\n- La richesse et le pouvoir, aussi immenses soient-ils, restent des épreuves de gratitude — jamais des récompenses définitivement acquises\n- La gratitude doit devenir un réflexe premier, face à chaque nouveau don reçu\n- La sagesse diplomatique surpasse souvent la force brute : une simple lettre a suffi à convertir tout un royaume\n\n---\n> 🤲 Sulayman ﷺ, à la tête du plus vaste royaume jamais accordé à un prophète, nous enseigne que la vraie royauté est celle d'un cœur qui reste humble devant Allah, quelle que soit l'étendue du pouvoir reçu."},{"title":"1️⃣9️⃣ Ilyas ﷺ — Le Défenseur du Tawhid","content":"## ⚔️ Seul contre tout un royaume\nIlyas ﷺ affronte, quasiment seul, le culte de Ba'al imposé par le roi Achab dans la région de Ba'albek — un combat spirituel mené sans le moindre soutien visible face à un pouvoir royal totalement acquis à l'idolâtrie.\n\n## 😔 Le moment où même un prophète craque\nÉpuisé, persécuté sans relâche, Ilyas ﷺ finit par implorer Allah de le rappeler à Lui, à bout de force face à l'ampleur de la tâche. La réponse d'Allah est bouleversante : Il lui révèle qu'il reste, cachés, **7000 croyants** que personne ne voyait. Ilyas ﷺ n'était pas seul — il ne le savait simplement pas.\n\n## 🌟 Une paix prononcée par Allah Lui-même\nDétail extrêmement rare dans tout le Coran : Allah prononce personnellement la paix sur lui — « Salamun ala Ilyas » (Coran, Sourate As-Saffat, 37:130) — un honneur que très peu de figures reçoivent de cette manière directe.\n\n## ☁️ Une fin qui échappe à la mort ordinaire\nSelon la tradition, Ilyas ﷺ est élevé miraculeusement, sans connaître le processus de mort habituel réservé au reste de l'humanité.\n\n## 🤔 Une leçon qui parle à quiconque se sent seul\nCette histoire résonne particulièrement pour quiconque a déjà eu l'impression de se battre seul pour ce qui est juste, sans soutien visible autour de soi. La leçon d'Ilyas ﷺ : Allah connaît des cœurs croyants que tu ne peux pas voir, et ta solitude apparente n'est peut-être qu'une question de perspective.\n\n## 💡 Ce que ce prophète t'apprend\n- La solitude spirituelle est une épreuve réelle et reconnue par Allah — même les prophètes l'ont ressentie profondément\n- Allah connaît des cœurs croyants qu'on ne voit jamais autour de soi\n- Prendre soin de sa santé spirituelle, même en demandant du répit dans l'épreuve, n'est pas une faiblesse à cacher\n\n---\n> 🤲 Ilyas ﷺ nous enseigne que même au plus profond de la solitude la plus totale, Allah nous voit — et voit aussi ceux qu'on ne voit pas nous-mêmes."},{"title":"2️⃣0️⃣ Al-Yasa' ﷺ — Le Successeur Fidèle","content":"## 🐄 Tout quitter pour suivre un maître\nAl-Yasa' ﷺ était, avant sa mission, un simple fermier — jusqu'au jour où il abandonne ses bœufs et sa ferme pour suivre Ilyas ﷺ, son maître spirituel. Un choix radical, sans retour en arrière, purement par attachement à la vérité qu'Ilyas ﷺ portait.\n\n## 🏃 Continuer seul, après le départ du maître\nAprès l'élévation d'Ilyas ﷺ, Al-Yasa' ﷺ ne s'effondre pas et ne cherche pas d'excuse pour arrêter — il **continue seul** la mission, avec ses propres forces, portant désormais la responsabilité entière de ce que son maître avait initié.\n\n## ✨ Des miracles au service des plus démunis\nSa mission est marquée par plusieurs miracles concrets : la purification d'une source empoisonnée, la multiplication miraculeuse d'huile pour une veuve dans le besoin, la guérison d'un général atteint de lèpre. Des miracles tournés systématiquement vers l'aide aux plus vulnérables.\n\n## 🤝 Le disciple qui devient à son tour un modèle\nCe qui rend Al-Yasa' ﷺ particulièrement inspirant : il ne se contente jamais d'imiter Ilyas ﷺ à l'identique. Il continue la mission avec sa propre personnalité, ses propres méthodes, tout en gardant intacte la même foi transmise.\n\n## 💡 Ce que ce prophète t'apprend\n- La foi se transmet d'une génération à l'autre par la fidélité concrète, pas seulement par les mots\n- L'humilité du disciple précède souvent la grandeur future du prophète ou du guide\n- La miséricorde d'Allah ne connaît pas de frontière limitée à un seul peuple\n\n---\n> 🤲 Al-Yasa' ﷺ nous enseigne que le vrai successeur n'imite pas mécaniquement — il continue la mission avec ses propres forces, tout en gardant la même foi intacte au fond du cœur."},{"title":"2️⃣1️⃣ Yunus ﷺ — Le Prophète de la Baleine","content":"## 😩 Une mission abandonnée par épuisement\nEnvoyé à Ninive, Yunus ﷺ finit par quitter sa mission **sans l'ordre d'Allah**, épuisé et découragé par le rejet massif et persistant de son peuple. Un geste d'impatience qui va déclencher l'une des séquences les plus spectaculaires de tout le Coran.\n\n## 🌊 Une tempête, un tirage au sort, et une chute dans l'obscurité\nEn mer, une tempête d'une violence inhabituelle éclate. Un tirage au sort désigne Yunus ﷺ pour être jeté par-dessus bord — il est alors avalé par un poisson immense. Trois obscurités s'accumulent sur lui : la nuit, la mer, et le ventre du poisson.\n\n## 🗣️ Une seule phrase, dite dans le noir total\nDans ces ténèbres absolues, Yunus ﷺ invoque : *« La ilaha illa anta subhanaka inni kuntu minaz-zalimin »* — « Il n'y a de divinité que Toi ! Gloire à Toi ! J'ai vraiment été du nombre des injustes. » (Coran, Sourate Al-Anbiya, 21:87) Pas de longue supplique élaborée — une reconnaissance sincère et immédiate de sa propre faute, adressée directement à Allah.\n\n## 🐋 Sauvé par une habitude déjà ancrée\nCe que beaucoup ignorent : les savants soulignent que c'est justement parce que Yunus ﷺ avait l'**habitude** régulière du dhikr avant cette épreuve qu'il a eu le réflexe de cette invocation au moment critique. Le Prophète ﷺ a précisé que cette prière n'est pas propre à Yunus ﷺ seul — tout croyant qui l'invoque dans la difficulté peut être exaucé de la même manière.\n\n## 🎉 Un peuple entier qui finit par croire\nRamené vers son peuple, Yunus ﷺ constate un fait unique dans tout le Coran : cette fois, **la totalité** de son peuple finit par croire — le seul cas dans l'histoire coranique où un peuple entier se convertit après avoir initialement rejeté son prophète.\n\n## 💡 Ce que ce prophète t'apprend\n- L'impatience, même chez un prophète, peut avoir un coût réel — personne n'est à l'abri de ce piège\n- Le dhikr quotidien, pratiqué en amont, sauve dans les moments de crise — ce n'est pas au moment de la crise qu'on doit commencer à prier pour la première fois\n- Aucune situation, même dans l'obscurité la plus totale, n'est sans issue avec Allah\n\n---\n> 🤲 Yunus ﷺ, surnommé Dhul-Nun, nous enseigne qu'au fond de l'obscurité la plus totale, une seule phrase sincère dite à Allah peut suffire à retourner totalement le cours du destin."},{"title":"2️⃣2️⃣ Zakariyya ﷺ — Le Prophète de la Prière Secrète","content":"## 👴 Une supplique murmurée, pas criée\nZakariyya ﷺ, grand prêtre et tuteur de Maryam, remarque un jour un fait troublant : la jeune Maryam reçoit une nourriture miraculeuse dont l'origine le dépasse. Plutôt que de simplement s'en étonner, il en tire une leçon directe pour lui-même : si Allah peut accomplir cela, alors rien ne Lui est impossible — pas même donner un enfant à un couple âgé et jusque-là stérile. Âgé, avec une épouse elle-même stérile, il implore Allah **en secret**, sans même que son entourage proche ne le sache.\n\n## 👶 Une réponse au-delà de toute attente\nAllah lui annonce la naissance d'un fils, **Yahya ﷺ** — et lui donne, comme signe de confirmation, une période de trois jours durant laquelle il ne peut plus parler, malgré une santé par ailleurs parfaite.\n\n## 🕊️ Une mort en martyr\nZakariyya ﷺ termine sa vie en martyr, selon la tradition — une fin marquée par la persécution, à l'image de plusieurs prophètes envoyés aux Bani Isra'il.\n\n## 🤫 Pourquoi cette invocation « secrète » est si importante\nCe détail — l'invocation faite en secret plutôt qu'en public — porte une leçon profonde : Allah entend la prière la plus murmurée, celle que personne d'autre n'entend jamais. Nul besoin de crier ou de se donner en spectacle pour être entendu de Lui.\n\n## 💡 Ce que ce prophète t'apprend\n- Allah entend la prière la plus discrète, murmurée dans l'intimité la plus totale\n- Ne jamais cesser d'invoquer, même quand toute logique humaine semble indiquer que c'est devenu impossible\n- La foi se nourrit aussi des signes qu'on prend le temps d'observer autour de soi, comme Zakariyya ﷺ l'a fait avec Maryam\n\n---\n> 🤲 Zakariyya ﷺ nous enseigne que la prière la plus douce à Allah est souvent celle murmurée dans la nuit, dans l'intimité totale entre toi et Lui seul."},{"title":"2️⃣3️⃣ Yahya ﷺ — Le Prophète de la Pureté","content":"## 🎁 Un fils annoncé miraculeusement\nYahya ﷺ est le fils tant espéré de Zakariyya ﷺ, dont la naissance a été annoncée dans des circonstances quasi miraculeuses. Détail unique : selon la tradition, son prénom n'avait **jamais** été donné à personne avant lui — un signe précoce de son caractère exceptionnel.\n\n## 🧘 Sagesse et pureté dès l'enfance\nContrairement à la plupart des figures religieuses qui reçoivent leur mission à l'âge adulte, Yahya ﷺ reçoit sagesse et pureté dès son plus jeune âge, menant une vie d'ascèse quasi totale — un niveau de rigueur spirituelle rare, même parmi les prophètes.\n\n## ✅ Un fait unique dans tout le Coran\nVoici ce qui rend Yahya ﷺ absolument à part parmi les 25 : selon le Coran, il n'a **jamais commis un seul péché** de toute sa vie — un statut que peu d'autres figures partagent de manière aussi explicite.\n\n## ⚔️ Dire non à un roi, au prix de sa vie\nSa fin tragique illustre son courage : il refuse de cautionner une union illicite exigée par le roi Hérode, malgré le pouvoir écrasant de ce dernier. Sa fermeté lui coûte la vie — il est décapité sur ordre du roi.\n\n## 💡 Ce que ce prophète t'apprend\n- Dire la vérité face au pouvoir, même au prix ultime, reste l'un des actes les plus courageux qu'un croyant puisse accomplir\n- Une vie de pureté totale reste possible, même dans un monde saturé de tentations\n- Le martyre pour la vérité n'est jamais une défaite — c'est, dans la perspective islamique, une victoire\n\n---\n> 🤲 Yahya ﷺ nous enseigne que mourir pour la vérité vaut infiniment mieux que vivre confortablement dans le silence complice de la lâcheté."},{"title":"2️⃣4️⃣ Issa ﷺ — Le Messie, Fils de Maryam","content":"## 👶 Un nourrisson qui parle pour défendre sa mère\nIssa ﷺ naît d'un miracle unique dans toute la création : sans père, par le seul commandement direct d'Allah — « Sois ! » et il fut. Quand des accusations injustes visent sa mère Maryam à peine après l'accouchement, Issa ﷺ, encore bébé dans son berceau, **prend la parole** pour défendre son honneur — un miracle que peu d'autres figures partagent.\n\n## ✨ Des miracles, toujours « avec la permission d'Allah »\nEnvoyé aux Bani Isra'il avec l'**Injil**, Issa ﷺ accomplit des miracles impressionnants : guérison de lépreux, résurrection de morts, animation d'un oiseau d'argile. Mais remarque la formule qui revient systématiquement dans le Coran : « avec la permission d'Allah » — jamais de son propre pouvoir. Une précision essentielle contre toute tentation de le diviniser.\n\n## ☝️ « Je suis Son serviteur » — sa propre déclaration\nIssa ﷺ proclame lui-même, dans le Coran, sa nature de simple serviteur d'Allah, rien de plus — anticipant et réfutant à l'avance toute déformation future de son message vers une divinisation qu'il n'a jamais revendiquée pour lui-même.\n\n## ☁️ Ni tué, ni crucifié — élevé\nFace à un complot visant à le crucifier, le Coran affirme une vérité qui contredit d'autres récits : « Ils ne l'ont ni tué ni crucifié... » (Coran, Sourate An-Nisa, 4:157) — il fut élevé par Allah, et selon la croyance islamique, il est toujours vivant et reviendra à la fin des temps.\n\n## 🔮 L'annonce d'un messager à venir\nIssa ﷺ annonce lui-même, selon le Coran, la venue future de Muhammad ﷺ — une continuité de mission plutôt qu'une rupture entre les messages successifs.\n\n## 💡 Ce que ce prophète t'apprend\n- Issa ﷺ est un serviteur d'Allah, jamais une divinité — il l'a proclamé lui-même sans ambiguïté\n- Tout miracle accompli par un prophète vient d'Allah, jamais du prophète lui-même par sa propre force\n- La vérité résiste au temps, même après des siècles de déformations et de réinterprétations\n\n---\n> 🤲 Issa ﷺ, l'un des 5 Ulu al-'Azm, nous enseigne que la vraie grandeur d'un prophète tient dans la clarté de son message : « Je suis le serviteur d'Allah », rien de plus, rien de moins."},{"title":"2️⃣5️⃣ Muhammad ﷺ — Le Sceau des Prophètes","content":"## 👶 Orphelin, illettré, et pourtant surnommé « le Digne de confiance »\nMuhammad ﷺ naît orphelin de père à La Mecque en 570, perd sa mère peu après — un départ dans la vie marqué par la perte. Illettré (ummi), il grandit pourtant au point d'être surnommé par tous, y compris ses adversaires futurs, **Al-Amin** (le digne de confiance) — un capital de réputation qu'il n'obtiendra jamais grâce à la richesse ou au pouvoir, mais uniquement grâce à son intégrité.\n\n## 🕳️ La grotte qui change tout\nÀ 40 ans, dans la grotte de Hira où il se retirait régulièrement pour réfléchir, il reçoit la première révélation, apportée par l'ange Jibril (Gabriel) — le début de 23 années qui vont redessiner durablement le monde.\n\n## 😔 Treize années de patience presque totale\nÀ La Mecque, 13 ans de prédication dans l'adversité : moqueries, tortures infligées à ses compagnons, boycott économique total de son clan, puis l'« Année de la Tristesse » — la mort de sa femme Khadija et de son oncle protecteur Abu Talib, la même année.\n\n## 🏛️ Dix ans à bâtir, depuis rien, une société entière\nAprès l'Hégire vers Médine, il consacre 10 ans à construire la toute première communauté islamique organisée — traités, alliances, batailles défensives, jusqu'à la conquête pacifique de La Mecque en 630, marquée par un pardon général envers ceux qui l'avaient persécuté pendant 13 ans.\n\n## 🏠 Le quotidien d'un homme qui reste simple malgré tout\nCe qui frappe le plus, une fois le pouvoir acquis : il continue d'aider aux tâches ménagères, joue avec ses petits-enfants, ne se venge jamais personnellement de ses ennemis (« Allez, vous êtes libres » à la conquête de La Mecque), interdit fermement la maltraitance animale, et continue de dormir sur une simple natte malgré son statut de chef d'État incontesté.\n\n## 🕋 Le dernier sermon, et la mort\nAprès le Hajj d'Adieu et son discours testamentaire devant 100 000 compagnons, il meurt en 632 — clôturant définitivement la lignée des 25 prophètes.\n\n## 💡 Ce que ce prophète t'apprend\n- « Vous avez dans le Messager d'Allah un excellent modèle » (Coran, Sourate Al-Ahzab, 33:21) — sa Sunnah constitue un guide de vie complet, pas seulement un ensemble de rituels\n- La miséricorde avant tout, y compris envers ceux qui l'ont fait le plus souffrir\n- Une constance sans faille sur 23 années, sans jamais transiger sur le Tawhid, même dans les moments les plus difficiles\n\n---\n> 🤲 Muhammad ﷺ, Khatam an-Nabiyyin (le Sceau des Prophètes), nous enseigne que la perfection humaine n'est pas l'absence de douleur — c'est la grâce avec laquelle on la traverse, en sachant que tout vient d'Allah et retourne à Lui."}],"obligations":[{"title":"1️⃣ Les Obligations Principales","content":"## 🤔 Une question pour commencer\nSi on te demandait de citer les obligations en Islam, tu penserais sans doute d'abord aux 5 piliers. Logique. Mais imagine deux musulmans qui accomplissent tous les deux parfaitement les 5 piliers : l'un lit le Coran chaque jour, respecte ses parents, tient sa langue ; l'autre néglige tout ça en dehors des piliers stricts. Sont-ils vraiment au même niveau de pratique ? Ce cours explore tout ce qui se joue **entre** les piliers.\n\n## 🕌 Nourrir sa relation avec Allah, au quotidien\n- **Lire et méditer le Coran** — l'abandonner complètement n'est pas une obligation stricte au sens légal, mais c'est une négligence qui, avec le temps, assèche la relation avec Allah\n- **Le Dhikr** — pas seulement dans la prière : mentionner Allah, par le cœur et la langue, en marchant, en travaillant, en attendant le bus\n- **La Dua** — s'adresser directement à Allah, sans intermédiaire, pour absolument tout : tes peurs, tes projets, ta gratitude\n- **Le jeûne volontaire** en dehors du Ramadan — lundi/jeudi, jours blancs (13-14-15 du mois lunaire), les 6 jours de Shawwal\n- **Se réserver du temps chaque jour** pour l'adoration et l'auto-éducation spirituelle, même 10 minutes\n\n## 📚 Une obligation qu'on oublie trop souvent : apprendre\n*« La recherche du savoir est une obligation pour tout musulman. »* (Hadith rapporté par Anas ibn Malik — Ibn Majah) Remarque bien la formulation : pas \"recommandée\", **obligatoire**. Comprendre sa religion pour la pratiquer avec conscience, pas juste reproduire des gestes appris par habitude sans en saisir le sens.\n\n## 🤝 Ce qu'on doit aux autres\n- **Le respect des parents** — mentionné dans le Coran juste après l'adoration d'Allah Lui-même, ce qui donne une idée de son importance. Paroles douces, obéissance dans le licite, subvenir à leurs besoins, et continuer à invoquer pour eux après leur mort\n- **L'honnêteté et l'intégrité** — dans la parole donnée, le commerce, chaque engagement pris\n- **Aider et soutenir les autres** — pas un idéal vague, une vraie obligation sociale concrète\n\n## 💬 Le combat le plus sous-estimé : sa propre langue\n*« La plupart des gens qui entrent en Enfer y entrent à cause de leur langue. »* (Hadith rapporté par Mu'adh ibn Jabal — Sunan at-Tirmidhi) Une phrase qui devrait faire réfléchir avant chaque parole. Un test simple à appliquer avant de parler : est-ce vrai ? Est-ce utile ? Est-ce bienveillant ? Si la réponse est non à l'une des trois, mieux vaut se taire.\n\n---\n\n> 🤲 Les 5 piliers sont la structure. Ces obligations-là sont ce qui remplit cette structure de vie réelle, jour après jour."},{"title":"2️⃣ Interdits et péchés à éviter en Islam","content":"## 🗺️ Pourquoi étudier les interdits, au juste ?\nUn mauvais réflexe consiste à voir ce sujet comme une liste de menaces à mémoriser par peur. La bonne approche est différente : voir ces interdits comme une carte détaillée des zones dangereuses, dessinée par quelqu'un qui connaît le terrain mieux que toi et veut sincèrement t'éviter d'y tomber.\n\n## 🔴 Les grands péchés (Al-Kabair)\nLe Prophète ﷺ en a désigné **7 comme particulièrement destructeurs** (Hadith des « sept péchés destructeurs » — Sahih al-Bukhari et Sahih Muslim) : le Shirk (le seul impardonnable si on y meurt sans repentir), la sorcellerie, le meurtre injuste, le Riba (l'usure), s'approprier le bien de l'orphelin, fuir le champ de bataille, et calomnier une femme vertueuse. Les savants en dénombrent bien plus largement, jusqu'à 70 : le Zina, le vol, l'alcool, la désobéissance grave aux parents, l'arrogance, l'injustice, l'abandon volontaire de la prière...\nLa bonne nouvelle au milieu de cette liste sévère : la **Tawba** (repentir) efface intégralement tout grand péché, à condition de regretter sincèrement, cesser immédiatement, résoudre de ne jamais y retourner — et réparer le tort si quelqu'un a été lésé.\n\n## 🟠 Les péchés mineurs — le vrai piège caché\nPris isolément, ils semblent presque insignifiants : une colère un peu excessive, une médisance légère, une moquerie, une précipitation dans la prière, un regard qui traîne, un peu de gaspillage. Mais le Prophète ﷺ avertit : *« ils s'accumulent sur l'homme jusqu'à le détruire »* (Hadith rapporté par Ibn Mas'ud — Musnad Ahmad) — comme des gouttes d'eau qui, une par une, finissent par creuser la roche. Ils deviennent réellement graves par la répétition, l'insouciance totale, ou pire, la fierté de les commettre ouvertement.\nCe qui les efface au quotidien : les 5 prières, le wudu, le vendredi, le Ramadan, les bonnes actions accomplies sincèrement, et l'Istighfar régulier — pas besoin d'attendre une occasion spéciale.\n\n## 🟠 Les interdits pratiques du quotidien, en un coup d'œil\n<table header-row=\"true\">\n<tr>\n<td>Domaine</td>\n<td>Exemples</td>\n</tr>\n<tr>\n<td>Alimentation</td>\n<td>Porc, alcool, sang, animal non sacrifié rituellement</td>\n</tr>\n<tr>\n<td>Relations sociales</td>\n<td>Mensonge, trahison, médisance (Ghiba), colportage (Namima), isolement avec un non-mahram</td>\n</tr>\n<tr>\n<td>Finances</td>\n<td>Riba, incertitude excessive (Gharar), jeux de hasard (Maysir), corruption</td>\n</tr>\n<tr>\n<td>Spiritualité</td>\n<td>Shirk, sorcellerie, consultation de voyants, superstitions</td>\n</tr>\n<tr>\n<td>Apparence</td>\n<td>Soie et or pour l'homme, Isbal, tatouage</td>\n</tr>\n<tr>\n<td>Divertissement</td>\n<td>Contenus immoraux, gaspillage du temps</td>\n</tr>\n</table>\n\n## 🛡️ S'en protéger concrètement, sans anxiété excessive\nUn bilan personnel chaque soir accompagné d'Istighfar, éviter délibérément les environnements à risque plutôt que de tester sa résistance, multiplier les bonnes actions pour équilibrer la balance, et se rappeler régulièrement du Jour du Jugement — sans en faire une source d'angoisse permanente, plutôt un repère utile.\n\n---\n\n> 🤲 Ces interdits ne sont pas des cages qui t'enferment — ce sont des garde-fous qui protègent, en même temps, ton corps, ton âme, ta famille et toute la société autour de toi."},{"title":"3️⃣ Le Bon Comportement (Akhlaq)","content":"## 🎯 Une phrase qui résume toute la mission du Prophète ﷺ\n*« Je n'ai été envoyé que pour parachever les bonnes mœurs. »* (Hadith rapporté par Abu Hurayra — Al-Muwatta et Musnad Ahmad, authentifié par Al-Albani) Relis cette phrase deux fois. Pas \"pour instaurer des rituels\", pas \"pour bâtir un empire\" — pour **parfaire le caractère**. Si la mission prophétique se résume à ça, alors le caractère n'est clairement pas un supplément optionnel à la foi : c'est son cœur battant.\n\n## 🌿 Les 10 qualités cardinales, et leur opposé à surveiller\n<table header-row=\"true\">\n<tr>\n<td>Qualité</td>\n<td>Ce qu'elle veut dire concrètement</td>\n<td>Opposé à éviter</td>\n</tr>\n<tr>\n<td>**Sabr** (patience)</td>\n<td>Tenir dans l'obéissance, résister au haram, accepter l'épreuve sans se révolter</td>\n<td>Impatience</td>\n</tr>\n<tr>\n<td>**Tawadu'** (humilité)</td>\n<td>Ne jamais se croire supérieur à qui que ce soit devant Allah</td>\n<td>Orgueil (Kibr)</td>\n</tr>\n<tr>\n<td>**Ikhlas** (sincérité)</td>\n<td>Agir uniquement pour Allah, jamais pour être vu ou complimenté</td>\n<td>Ostentation (Riya)</td>\n</tr>\n<tr>\n<td>**Adab** (respect)</td>\n<td>Saluer en premier, parler avec douceur, remercier sincèrement</td>\n<td>Impolitesse</td>\n</tr>\n<tr>\n<td>**Hilm** (maîtrise de soi)</td>\n<td>Se maîtriser plutôt que réagir à chaud — \"le fort est celui qui se maîtrise\" (Hadith rapporté par Abu Hurayra — Sahih al-Bukhari et Sahih Muslim)</td>\n<td>Colère non maîtrisée</td>\n</tr>\n<tr>\n<td>**Karam** (générosité)</td>\n<td>Donner sans compter, même quand c'est peu</td>\n<td>Avarice</td>\n</tr>\n<tr>\n<td>**Shukr** (gratitude)</td>\n<td>Reconnaître les bienfaits par le cœur, la langue, et les actes</td>\n<td>Ingratitude</td>\n</tr>\n<tr>\n<td>**Shaja'a** (courage)</td>\n<td>Dire la vérité face au pouvoir, défendre le plus faible que soi</td>\n<td>Lâcheté</td>\n</tr>\n<tr>\n<td>**'Adl** (justice)</td>\n<td>Traiter chacun selon ce qui lui est dû, sans favoritisme</td>\n<td>Injustice</td>\n</tr>\n<tr>\n<td>**Rahma** (bienveillance)</td>\n<td>Compassion envers les humains, les animaux, toute la création</td>\n<td>Dureté de cœur</td>\n</tr>\n</table>\n\n## 🧰 Des outils concrets, pas juste des idéaux\n- Face à la colère qui monte : dire *A'udhu billahi min ash-shaytani r-rajim*, changer de position (assis si debout, allongé si assis), faire le wudu pour se rafraîchir littéralement\n- Tenir un petit journal de gratitude : 3 bienfaits notés chaque jour, aussi banals soient-ils\n- Fixer un montant mensuel de Sadaqah, même minime, pour transformer la générosité en habitude plutôt qu'en élan ponctuel\n- Avant chaque acte important : se poser une seule question — \"pour qui est-ce que je fais vraiment ça ?\"\n\n## 💡 Le test ultime du bon caractère\nCe n'est pas ta politesse envers un imam ou un savant qui prouve ton Akhlaq — n'importe qui peut être respectueux face à l'autorité. Le vrai test, c'est comment tu traites une personne qui ne peut absolument rien t'apporter en retour : le livreur, la caissière, le chauffeur, l'inconnu dans la rue.\n\n---\n\n> 🤲 *« Les croyants les plus parfaits en foi sont ceux qui ont le meilleur caractère. »* (Hadith rapporté par Abu Hurayra — Sunan at-Tirmidhi, authentifié) L'Akhlaq n'est pas la cerise sur le gâteau de la foi — c'est la preuve tangible qu'elle a vraiment pénétré le cœur, au-delà des simples paroles."},{"title":"4️⃣ Mariage (Nikah)","content":"## 💍 Un contrat, pas juste une fête\nRetiens bien ceci avant tout le reste : le Nikah est d'abord un **contrat légal**, pas seulement une célébration. Comme tout contrat sérieux, il a des conditions précises à respecter pour être valide.\n\n## ✅ Ce qui rend un Nikah valide\nConsentement libre des deux parties (personne ne peut être forcé), 2 témoins musulmans, un Mahr (la dot — un droit exclusif de la femme, qu'elle garde pour elle-même, montant libre à négocier), et un Wali (le tuteur de la femme, en priorité son père).\n\n## 🚫 Le Mahram — qui on ne peut jamais épouser\nInterdictions permanentes par le sang (mère, sœur, fille, tante...), par allaitement (5 tétées avant l'âge de 2 ans créent le même lien), par alliance (belle-mère, belle-fille). Interdictions temporaires : épouser 2 sœurs simultanément, une femme déjà mariée ou encore en période d'idda, ou une 5e épouse.\n\n## ⚖️ Un équilibre de droits, pas une hiérarchie à sens unique\nLe mari doit subvenir aux besoins (nafaqa), traiter son épouse avec bienveillance, verser le mahr promis. L'épouse doit l'obéissance dans ce qui est licite et préserve le foyer. *« Elles ont des droits équivalents à leurs obligations. »* (Coran, Sourate Al-Baqara, 2:228) — remarque le mot \"équivalents\", pas \"différents sans contrepartie\".\n\n## 💔 Divorce et Idda — se séparer avec des règles claires\nTrois talaq successifs rendent le divorce irrévocable. L'Idda dure 3 cycles menstruels après un divorce, ou 4 mois et 10 jours après un décès — une période qui protège à la fois la filiation d'un éventuel enfant et laisse un temps de réflexion avant tout remariage. Le Khul' permet à la femme, de son côté, de demander la séparation en restituant le mahr reçu.\n\n## 👥 La polygamie, souvent mal comprise\nJusqu'à 4 épouses — mais sous une condition que le Coran lui-même pose comme quasiment impossible à remplir : la **justice absolue** entre elles. *« Si vous craignez de ne pas être équitables, n'en épousez qu'une seule. »* (Coran, Sourate An-Nisa, 4:3) Le Coran précise ailleurs que la justice sentimentale totale entre plusieurs épouses est, de fait, hors de portée humaine — d'où le fait que beaucoup de savants considèrent la monogamie comme la norme la plus sûre.\n\n## 🇫🇷 Le point le plus important pour vivre en France\nLe **mariage civil doit précéder ou accompagner** le nikah religieux. Un nikah seul, aussi sincère soit-il spirituellement, laisse la femme sans **aucune** protection juridique française — ni succession, ni pension, ni reconnaissance légale en cas de séparation.\n\n---\n\n> 🤲 *« Il a mis entre vous de l'affection et de la bonté. »* — Sourate Ar-Rum, verset 21 : le mariage islamique vise, au-delà des règles, une vraie tranquillité partagée."},{"title":"5️⃣ Décès et rites funéraires (Janazah)","content":"## 🤲 Un devoir envers celui qui ne peut plus rien faire pour lui-même\nLa Janazah — l'ensemble des rites funéraires islamiques — est ce qu'on appelle une obligation collective (Fard Kifaya) : si une partie suffisante de la communauté l'accomplit, les autres en sont dégagés. Mais dans les faits, personne ne devrait s'en désintéresser : c'est le dernier service qu'on rend à quelqu'un qui ne peut plus rien pour lui-même.\n\n## 📋 Les 5 étapes, dans l'ordre\n1. **À l'annonce du décès** — dire *Inna lillahi wa inna ilayhi raji'un*, fermer délicatement les yeux du défunt, couvrir le corps\n2. **Kafan** — un linceul blanc simple, 3 pièces pour un homme, 5 pour une femme\n3. **Dafn** — un enterrement rapide, le corps placé sur le côté droit, face à la Qibla\n\n\n## 🚿 Le Ghusl funéraire, étape par étape\n1. Formuler l'intention (Niyya) et veiller à ce que la nudité du défunt reste couverte à tout moment\n2. Laver d'abord les parties intimes, avec des gants, sans regarder ni toucher directement\n3. Faire les ablutions du défunt comme pour la prière, en humidifiant un tissu plutôt qu'en versant de l'eau directement dans la bouche ou le nez\n4. Laver l'ensemble du corps à l'eau et au savon, un nombre impair de fois (3, 5 ou 7), en commençant toujours par le côté droit\n5. Ajouter un peu de camphre à l'eau lors du tout dernier lavage\n6. Sécher soigneusement le corps avec un tissu propre avant de l'envelopper dans le Kafan\n\n## 🕌 La Salat al-Janazah, étape par étape\n1. Se tenir debout, sans inclinaison ni prosternation — l'imam se positionne face à la tête du défunt s'il s'agit d'un homme, au niveau du milieu du corps s'il s'agit d'une femme\n2. 1er Takbir (Allahu Akbar) — réciter Al-Fatiha en silence\n3. 2e Takbir — réciter une prière sur le Prophète ﷺ (la Salat Ibrahimiyya)\n4. 3e Takbir — invoquer Allah pour le défunt, en demandant pardon et miséricorde\n5. 4e Takbir — courte invocation supplémentaire, puis un bref silence\n6. Terminer par le Salam, en tournant la tête à droite puis à gauche\n\n## ⚠️ Ce qui est explicitement déconseillé\nLes lamentations bruyantes, se frapper le visage en signe de deuil, construire des monuments imposants sur les tombes, allumer des bougies — l'Islam privilégie une sobriété qui n'empêche pas la tristesse, mais l'exprime différemment.\n\n## 🖤 Le deuil (Hidad) — des durées bien précises\nPour les proches en général : 3 jours maximum recommandés. Pour la veuve : 4 mois et 10 jours (l'idda du décès), une période durant laquelle elle évite les sorties non nécessaires et ne se remarie pas.\n\n## 🌟 Ce qui continue à profiter au défunt, même après la mort\n*« Quand l'être humain meurt, ses actions s'arrêtent, sauf trois : une aumône continue (sadaqah jariya), un savoir utile qu'il laisse derrière lui, ou un enfant vertueux qui invoque pour lui. »* (Hadith rapporté par Abu Hurayra — Sahih Muslim) Avant tout partage de l'héritage, deux priorités absolues : régler ses dettes et exécuter son testament, dans la limite du tiers des biens.\n\n---\n\n> 🤲 *« Toute âme goûtera la mort... et vous serez ramenés à Nous. »* — Sourate Al-Anbiya, verset 35. Ces rites ne sont pas de simples formalités : ils rappellent, à chaque fois, ce vers quoi chacun de nous se dirige."},{"title":"6️⃣ Succession et répartition des biens (Faraid)","content":"## 📖 \"La moitié du savoir\" — rien que ça\nLe Prophète ﷺ a qualifié le Faraid (la science de la succession) de \"moitié du savoir\" (Hadith rapporté par Abu Hurayra — Ibn Majah ; authenticité discutée par certains savants du hadith) — une expression forte qui montre à quel point ce sujet, souvent perçu comme purement technique et ennuyeux, occupe en réalité une place centrale dans la jurisprudence islamique.\n\n## 📝 L'ordre des priorités, avant même de penser au partage\n1. Frais funéraires → 2. Dettes envers Allah (zakat impayée, etc.) → 3. Dettes envers les hommes → 4. Testament (Wasiyya, limité au tiers du patrimoine, réservé aux non-héritiers) → 5. **Seulement ensuite**, la distribution selon le Faraid.\nBeaucoup de familles commettent l'erreur de partager directement sans respecter cet ordre — une source fréquente de conflits évitables.\n\n## ⚖️ Les parts principales, en bref\nÉpouse : 1/8 (avec enfants) ou 1/4 · Époux : 1/4 ou 1/2 · Mère : 1/6 ou 1/3 · Père : 1/6 ou 2/3 · Fille unique : 1/2.\n\n## 🤔 La question qu'on te pose souvent : pourquoi le fils reçoit-il le double de la fille ?\nCe point suscite régulièrement des interrogations légitimes. La réponse tient dans un principe d'ensemble, pas dans une dévalorisation : le fils porte, en Islam, des **obligations financières** que la femme n'a pas — subvenir à sa future famille, verser un mahr à son épouse — alors que la femme, elle, garde l'intégralité de son héritage rien que pour elle, sans aucune obligation de le partager avec qui que ce soit, même son mari.\n\n## 🚫 Qui est exclu de l'héritage\nLe meurtrier n'hérite jamais de sa victime, quelles que soient les circonstances. Selon la majorité des savants, une différence de religion empêche également un non-musulman d'hériter d'un musulman.\n\n## 🇫🇷 Concilier Faraid et droit français\nEn France, c'est le droit civil qui s'applique légalement — parts égales entre garçons et filles, sans distinction. Un **testament notarié**, dans la limite de la quotité disponible autorisée par la loi française, permet de se rapprocher du Faraid sans sortir du cadre légal. La bonne pratique : consulter à la fois un notaire ET un savant qualifié, plutôt que de trancher seul dans son coin.\n\n---\n\n> 🤲 *« Allah vous enjoint au sujet de vos enfants : au fils une part équivalente à celle de deux filles. »* — Sourate An-Nisa, verset 11 : un système pensé comme un tout cohérent, pas comme une inégalité isolée."},{"title":"7️⃣ Naissance et enfance","content":"## 👶 Un accueil pensé dès les premières secondes\nCe qui frappe dans la tradition islamique autour de la naissance, c'est à quel point tout est pensé pour que les tout premiers instants d'un enfant soient déjà marqués par la foi — avant même qu'il ne puisse comprendre quoi que ce soit.\n\n## 🌙 Les rites de naissance, un par un\n- **Adhan** dans l'oreille droite, **Iqama** dans la gauche — littéralement, le premier mot qu'entend l'enfant dans sa vie est le nom d'Allah\n- **Tahnik** — frotter délicatement le palais du nouveau-né avec une datte mâchée\n- **Le prénom** — choisi dans les 7 jours suivant la naissance, glorifiant Allah ou honorant un prophète ou un compagnon\n- **Rasage de la tête** au 7e jour, accompagné d'une sadaqah équivalente au poids des cheveux coupés, en argent\n- **Aqiqa** — un sacrifice au 7e jour : 2 ovins pour un garçon, 1 pour une fille\n- **Circoncision (Khitan)** — une pratique sunnah pour les garçons\n\n## 🍼 L'allaitement, bien plus qu'une question nutritionnelle\nRecommandé jusqu'à **2 ans complets**. Un détail souvent méconnu : 5 tétées complètes avant l'âge de 2 ans créent un véritable lien de mahram entre l'enfant et sa nourrice, ainsi qu'avec les proches de celle-ci — un lien religieux, pas seulement affectif.\n\n## 🎓 Semer la foi tôt, sans brusquer\nDès le plus jeune âge : dire Bismillah avant chaque action, apprendre des sourates courtes. Vers 7 ans : initiation en douceur à la prière. À l'approche de la puberté : expliquer clairement les obligations et la notion de responsabilité morale (taklif) qui commence à peser sur l'enfant devenu adulte religieusement.\n\n## ⚖️ Ce que l'enfant est en droit de recevoir\nLa vie, un prénom honorable, une filiation reconnue, l'éducation, la subsistance, et une équité stricte entre tous les frères et sœurs — sans favoritisme.\n\n---\n\n> 🤲 *« Seigneur, fais de moi quelqu'un qui accomplit la prière, ainsi que de ma descendance. »* — Sourate Ibrahim, verset 40 : une invocation qui rappelle que l'éducation religieuse d'un enfant commence bien avant qu'il ne sache parler."},{"title":"8️⃣ Fêtes religieuses","content":"## 🎉 Seulement deux fêtes officielles — ça peut surprendre\nContrairement à d'autres traditions religieuses qui multiplient les célébrations tout au long de l'année, l'Islam ne reconnaît officiellement que **deux fêtes**. *« Allah vous a donné deux jours meilleurs que ceux de la Jahiliyya. »* (Hadith rapporté par Anas ibn Malik — Sunan Abu Dawud) — une phrase du Prophète ﷺ qui montre que ces deux jours remplacent volontairement toutes les fêtes préislamiques plus nombreuses.\n\n## 🌙 Eid al-Fitr — la fin d'un mois d'effort\nCélébrée le 1er Chawwal, juste après le Ramadan. Un point à ne surtout pas oublier : la **Zakat al-Fitr est obligatoire** avant la prière de l'Eid — environ 2,5 à 3kg de nourriture ou son équivalent, par personne du foyer. Rituel du matin : Ghusl, les plus beaux habits qu'on possède, manger quelques dattes avant même la prière, puis la prière en congrégation (2 rak'at accompagnées de takbirs supplémentaires).\n\n## 🐑 Eid al-Adha — la fête du sacrifice\nLe 10 Dhul-Hijja, sur 3 à 4 jours. Elle commémore le sacrifice d'Ibrahim ﷺ — sa soumission totale, pas la mort de son fils, puisque celui-ci fut épargné. L'Udhiyya (le sacrifice rituel) a lieu après la prière, et la viande se partage traditionnellement en 3 parts égales : la famille, les proches, et les personnes dans le besoin. Les Takbirat de Tashriq résonnent du 9 au 13 Dhul-Hijja.\n\n## ⭐ D'autres moments forts à connaître, même sans être des \"fêtes\" officielles\n<table header-row=\"true\">\n<tr><td>Période</td><td>Ce qu'elle représente</td></tr>\n<tr><td>Laylat al-Qadr (fin Ramadan)</td><td>Une nuit meilleure que 1000 mois</td></tr>\n<tr><td>10 premiers jours de Dhul-Hijja</td><td>Les meilleurs jours de toute l'année</td></tr>\n<tr><td>Jour d'Arafa (9 Dhul-Hijja)</td><td>Efface les péchés de 2 années</td></tr>\n<tr><td>Achoura (10 Mouharram)</td><td>Efface les péchés d'une année</td></tr>\n<tr><td>Nuit du Mi'raj (27 Rajab)</td><td>L'ascension du Prophète ﷺ</td></tr>\n</table>\n\n## ⚠️ Un point de divergence à connaître honnêtement\nLe Mawlid, célébrant la naissance du Prophète ﷺ, reste un sujet sur lequel les savants divergent réellement — certains l'encouragent comme un rappel bénéfique, d'autres le déconseillent fermement comme une innovation. Ce n'est pas à ce cours de trancher : renseigne-toi auprès d'une personne de confiance si la question te concerne.\n\n---\n\n> 🤲 *« C'est par la grâce d'Allah et par Sa miséricorde — qu'ils s'en réjouissent donc. »* — Sourate Yunus, verset 58 : la joie, en Islam, n'est jamais un péché — elle a simplement ses propres cadres."},{"title":"9️⃣ Alimentation et lois halal/haram","content":"## 🍽️ Une règle de base simple, avant les détails\nRetiens cette règle avant tout le reste, elle simplifie énormément les choses : *« Tout est permis sauf ce qui est explicitement interdit. »* — un principe juridique (qa'ida fiqhiyya) déduit par les savants de plusieurs versets et hadiths, et non une citation unique. Pas besoin de vérifier chaque aliment comme s'il était présumé haram — c'est l'inverse : l'interdiction est l'exception, pas la norme.\n\n## 📖 Les 4 catégories à distinguer\n**Halal** = permis · **Haram** = interdit · **Makruh** = déconseillé sans être interdit · **Shubha** = douteux, à éviter par prudence quand on n'est pas sûr.\n\n## 🚫 Ce qui est clairement haram\nLe porc et tous ses dérivés, l'alcool sous toutes ses formes — y compris caché dans certaines préparations culinaires —, le sang, les animaux morts sans abattage rituel, les animaux carnivores et les rapaces, et tout animal abattu sans que Bismillah n'ait été prononcé.\n\n## 🔪 L'abattage rituel (Dhabiha), étape par étape\nUn animal vivant et en bonne santé, un abatteur musulman, la formule Bismillah prononcée, une tranche rapide et nette de la gorge et des jugulaires, puis un écoulement complet du sang. Un point encore débattu chez les savants aujourd'hui : l'étourdissement préalable à l'abattage, une pratique industrielle moderne sur laquelle les avis divergent.\n\n## 🔍 Les additifs à surveiller de près\nE120 (la cochenille, un colorant d'origine animale), E441 et E471 (gélatine et mono-diglycérides, potentiellement d'origine porcine selon la source) — un simple réflexe de vérification évite bien des erreurs de bonne foi.\n\n## 🙏 Une éthique alimentaire, pas juste une liste d'interdits\nBismillah avant de manger, Alhamdulillah après, manger de la main droite, viser la modération — *« le fils d'Adam ne remplit pas un vase pire que son ventre »* (Hadith rapporté par Miqdam ibn Ma'dikarib — Sunan at-Tirmidhi) — et éviter tout gaspillage inutile.\n\n## 🇫🇷 En pratique, au quotidien\nLes labels reconnus comme fiables en France : AVS, SFCVH. Le poisson est halal par défaut, sans certification nécessaire. Manger chez des amis ou collègues non-musulmans reste permis, à condition d'éviter simplement ce qui est clairement identifié comme haram.\n\n---\n\n> 🤲 *« Ô les croyants ! Mangez des bonnes choses que Nous vous avons attribuées et soyez reconnaissants envers Allah. »* — Sourate Al-Baqara, verset 172 : remarque que le verset lie directement l'alimentation permise à la gratitude, pas seulement à l'interdiction."},{"title":"🔟 Vie familiale et droits sociaux","content":"## 👪 La famille, premier terrain d'application de la foi\nAvant même de parler de société ou de communauté au sens large, l'Islam commence par un cercle bien plus proche : comment tu traites tes propres parents, tes enfants, tes voisins. C'est là, dans ce cercle immédiat, que la sincérité d'une foi se vérifie le plus concrètement.\n\n## 👵 Envers les parents\nDes paroles douces en toutes circonstances, l'obéissance dans ce qui est licite, subvenir à leurs besoins quand ils vieillissent, des visites régulières, et continuer à invoquer pour eux après leur mort. Un point souvent oublié : ce respect reste dû **même envers des parents non-musulmans**.\n\n## 👶 Envers les enfants\nSubsistance (nafaqa), reconnaissance officielle et filiation claire, équité stricte entre tous les enfants sans favoritisme. En cas de divorce, la garde (Hadana) revient en priorité à la mère pour les jeunes enfants, selon la majorité des écoles.\n\n## 🏘️ Envers les voisins — une insistance qui devrait surprendre\n*« Jibril m'a tant recommandé le voisin que j'ai cru qu'il allait lui accorder l'héritage. »* (Hadith rapporté par Aisha — Sahih al-Bukhari et Sahih Muslim) Une phrase du Prophète ﷺ qui montre à quel point le sujet du voisinage est pris au sérieux dans l'Islam — bien au-delà d'une simple politesse de circonstance. Ne pas nuire, aider en cas de besoin, respecter son intimité — y compris envers un voisin non-musulman.\n\n## 🤝 Liens de parenté et fraternité\nMaintenir activement les liens familiaux (Silat ar-Rahim) est une obligation religieuse, et les rompre est considéré comme un péché grave — pas juste un choix personnel neutre. Entre musulmans, une série de droits mutuels : saluer, répondre à une invitation, visiter le malade — et à l'inverse, éviter la moquerie, la calomnie, la jalousie.\n\n## 💝 Une attention particulière pour les plus vulnérables\nProtéger les orphelins figure parmi les actes les plus méritoires en Islam. La Zakat et la Sadaqah assurent, à l'échelle de toute la société, une redistribution continue vers les plus démunis.\n\n---\n\n> 🤲 *« Les croyants et les croyantes sont alliés les uns des autres. »* — Sourate At-Tawba, verset 71 : la solidarité, en Islam, n'est jamais présentée comme une option facultative."},{"title":"1️⃣1️⃣ Commerce et vie professionnelle","content":"## 💼 Le travail, vu comme une forme d'adoration\n*« Nul ne mange de meilleure nourriture que celle qu'il a gagnée par le travail de ses propres mains. »* (Hadith rapporté par Al-Miqdam ibn Ma'dikarib — Sahih al-Bukhari) Une phrase qui replace immédiatement le travail honnête dans une dimension bien plus haute qu'une simple nécessité économique. Honnêteté, transparence, mesures justes, contrats clairs : autant d'obligations, pas de simples bonnes pratiques commerciales.\n\n## 💸 Le Riba — sans doute l'interdit financier le plus important\n*« Allah a rendu licite le commerce et illicite le Riba. »* (Coran, Sourate Al-Baqara, 2:275) Concrètement, ça couvre tout intérêt perçu sur un prêt, une carte de crédit, un prêt immobilier classique. Des alternatives existent : Murabaha, Ijara, Musharaka, ou les banques islamiques — même si elles restent, en pratique, moins répandues et parfois plus coûteuses en France.\n\n## ❌ Les autres transactions à éviter\nLa vente de produits haram, la spéculation excessive (Gharar), les jeux de hasard (Maysir), les monopoles artificiels créés pour manipuler les prix, et la corruption (Rishwa) sous toutes ses formes.\n\n## 🤝 Des droits qui vont dans les deux sens\nPour l'employé : un salaire versé sans retard — *« avant que la sueur ne sèche »* (Hadith rapporté par Ibn Umar — Sunan Ibn Majah) —, le respect et la dignité, du temps accordé pour les prières. En échange, l'employeur est en droit d'attendre loyauté et honnêteté réelle de son employé.\n\n## 🇫🇷 Les questions concrètes qui reviennent souvent en France\nTravailler dans un rayon non-haram d'un supermarché généraliste : généralement toléré par les savants. L'assurance obligatoire (auto, habitation) : tolérée par nécessité (darura), faute d'alternative réaliste. Un PEE (plan épargne entreprise) investi dans des fonds incluant du haram : à éviter si une alternative existe, en privilégiant plutôt des fonds ISR ou responsables quand c'est possible.\n\n---\n\n> 🤲 *« Le marchand honnête et de confiance sera avec les prophètes, les véridiques et les martyrs. »* (Hadith rapporté par Abu Sa'id al-Khudri — Sunan at-Tirmidhi) — Une promesse énorme, pour un domaine — le commerce — qu'on associe rarement spontanément à la spiritualité."},{"title":"1️⃣2️⃣ Vie spirituelle et morale","content":"## 🧭 Le Tawhid, la lentille à travers laquelle tout se regarde\nToute la vie spirituelle repose, au fond, sur une seule chose : comprendre réellement ce qu'implique l'unicité d'Allah. Comprendre le Tawhid en profondeur ne change pas ce qui t'arrive dans la vie — ça change complètement le **regard** que tu poses sur chaque événement, heureux ou difficile.\n\n## 🌙 La prière, bien au-delà de l'obligation stricte\nQiyam al-Layl (la prière de nuit), Salat ad-Duha (en matinée), les Rawatib (des rak'at surérogatoires autour des prières obligatoires), le Witr — le Prophète ﷺ ne l'abandonnait jamais, même en voyage, même fatigué. Ce sont ces prières \"en plus\" qui, souvent, font la vraie différence dans une relation avec Allah.\n\n## 📿 Le Dhikr, un ancrage permanent\n*« C'est par le rappel d'Allah que les cœurs se tranquillisent. »* (Coran, Sourate Ar-Ra'd, 13:28) Les adhkar du matin et du soir, le tasbih après chaque prière (SubhanAllah, Alhamdulillah, Allahu Akbar) : de petits rituels répétés qui, cumulés sur des années, transforment profondément un état d'esprit.\n\n## 🔄 Tawakkul et Tawba, les deux faces d'une même confiance\n**Tawakkul** : donner tous ses efforts humains, puis remettre humblement le résultat à Allah, sans anxiété excessive sur ce qu'on ne contrôle pas. **Tawba** : regretter, cesser, ne jamais recommencer — un chemin toujours accepté, tant qu'on est en vie.\n\n## 💔 Les maladies du cœur, et leurs remèdes précis\n<table header-row=\"true\">\n<tr><td>Maladie</td><td>Remède concret</td></tr>\n<tr><td>Kibr (orgueil)</td><td>Méditer sincèrement sur sa propre faiblesse</td></tr>\n<tr><td>Riya (ostentation)</td><td>Purifier l'intention avant chaque acte, pas après</td></tr>\n<tr><td>Hasad (jalousie)</td><td>Dire consciemment Barakallahu fihi</td></tr>\n<tr><td>Ghafla (insouciance)</td><td>Augmenter volontairement le dhikr</td></tr>\n</table>\n\n## 🌱 Une routine spirituelle simple à tenir sur la durée\nAu Fajr : adhkar puis un peu de Coran. Pendant la journée : Bismillah et Alhamdulillah, glissés naturellement. Au coucher : adhkar du soir, Ayat al-Kursi. Le vendredi : la sourate Al-Kahf. Chaque mois : le jeûne des 3 jours blancs.\n\n---\n\n> 🤲 *« Ô toi, l'âme apaisée ! Retourne vers ton Seigneur, satisfaite et agréée. »* — Sourate Al-Fajr, versets 27-28 : c'est exactement l'état recherché par toutes ces pratiques réunies, pas un objectif secondaire."},{"title":"1️⃣3️⃣ Le Mahram","content":"## 🔑 Une notion qui protège plus qu'elle ne restreint\nLe Mahram désigne toute personne avec qui le mariage est, définitivement et sans exception, impossible — par le sang, par l'allaitement, ou par le mariage. Un avantage concret : devant son Mahram, une femme n'est pas obligée de se couvrir, et peut voyager en sa seule compagnie sans autre accompagnement nécessaire.\n\n## 🧬 Par le sang\nLes parents, grands-parents, enfants, petits-enfants, frères et sœurs, neveux et nièces, oncles et tantes — le premier cercle familial au sens large.\n\n## 🍼 Par l'allaitement — un lien souvent méconnu\nLes mêmes liens que par le sang se créent si l'enfant a reçu **5 tétées complètes avant l'âge de 2 ans** — un mécanisme qui, dans les sociétés où l'allaitement était partagé entre femmes, créait des liens familiaux à part entière.\n\n## 💍 Par le mariage\nLe beau-père et la belle-mère deviennent mahram dès la conclusion du contrat de mariage ; le beau-fils et la belle-fille, après la consommation du mariage.\n\n## ⚠️ Les deux erreurs les plus fréquentes à corriger\nLe **cousin germain n'est PAS mahram** — contrairement à ce que beaucoup pensent instinctivement. Le **beau-frère non plus** — et le Prophète ﷺ a même averti spécifiquement à ce sujet : *« Le beau-frère c'est la mort »* (Hadith rapporté par Uqba ibn Amir — Sahih al-Bukhari), précisément parce qu'il a un accès facile et régulier au foyer, sans en avoir pourtant le statut protecteur d'un mahram.\n\n## ✈️ La question du voyage\nSelon la majorité des écoles classiques, une femme ne voyage pas sans mahram au-delà d'une certaine distance (environ 90 km) — même si les avis contemporains divergent selon le contexte moderne (sécurité, moyens de transport, accompagnement collectif).\n\n---\n\n> 🤲 La notion de Mahram n'est pas une restriction arbitraire — c'est un système pensé pour protéger l'honneur et la dignité, en clarifiant précisément qui peut avoir un accès rapproché à qui."},{"title":"1️⃣4️⃣ La 'Awra","content":"## 👗 Une notion qui varie selon la situation, pas une règle unique\nLa 'Awra désigne les parties du corps à couvrir obligatoirement — et contrairement à une idée reçue, elle **n'est pas fixe** : elle change selon le genre de la personne, celui qui se trouve en face, et le contexte précis (prière, vie quotidienne, devant son conjoint).\n\n## 👨 Pour l'homme\nDu nombril jusqu'au genou inclus, devant absolument tout le monde — sauf son épouse, avec qui il n'existe aucune 'awra du tout.\n\n## 👩 Pour la femme, selon qui est en face\n<table header-row=\"true\">\n<tr><td>Devant qui</td><td>Zone à couvrir</td></tr>\n<tr><td>Son mari</td><td>Rien</td></tr>\n<tr><td>Mahrams masculins</td><td>Poitrine, ventre, dos, cuisses</td></tr>\n<tr><td>Femmes musulmanes</td><td>Du nombril aux genoux</td></tr>\n<tr><td>Hommes non-mahrams</td><td>Tout sauf le visage et les mains, selon la majorité des écoles</td></tr>\n</table>\n\n## 🕌 Dans la prière — une règle plus stricte que le quotidien\nY compris seule chez elle, sans personne autour, la femme couvre tout sauf le visage et les mains pendant la prière — une exigence plus élevée que dans la vie de tous les jours. L'homme, lui, couvre au minimum du nombril aux genoux, idéalement les épaules également.\n\n## 🏥 Les exceptions justifiées par la nécessité\nUn examen médical, une urgence de santé : la nécessité (darura) lève temporairement l'obligation, mais toujours dans la limite du strict nécessaire — pas au-delà.\n\n---\n\n> 🤲 *« La pudeur et la foi sont liées — quand l'une disparaît, l'autre disparaît. »* (Hadith rapporté par Ibn Umar — Al-Hakim, authentifié) — Une phrase du Prophète ﷺ qui montre que la 'Awra n'est pas qu'une question vestimentaire : elle protège quelque chose de plus profond."},{"title":"1️⃣5️⃣ Islam en France — Questions pratiques","content":"## 🌍 Des questions que les textes classiques n'ont jamais eu à traiter\nVivre pleinement sa foi dans un pays comme la France soulève forcément des questions très concrètes que les savants du 7e siècle n'avaient jamais eu à trancher — pas parce que l'Islam serait incomplet, mais parce que le monde a changé.\n\n## 📝 Un tour rapide des questions les plus fréquentes\n- **Mariage** — le civil est obligatoire, avant ou en même temps que le nikah religieux\n- **Zakat** — nissab autour de 5000-6000€, taux de 2,5%, à verser à des organismes fiables comme Secours Islamique France ou La Zakat House\n- **Alimentation** — labels AVS ou SFCVH ; le poisson reste toujours halal, sans exception\n- **Ramadan en été** — suivre les horaires réels de sa propre ville, bien s'hydrater durant la nuit\n- **Prière au travail** — rien ne l'interdit légalement ; ça se négocie avec l'employeur, pas un droit automatique\n- **Obsèques** — des carrés musulmans existent dans la plupart des grandes villes françaises\n- **Financement immobilier** — vente à terme, SCI familiale, épargne progressive comme alternatives au prêt classique\n- **Assurances et certains médicaments** — tolérés par nécessité (darura) quand aucune alternative réaliste n'existe\n\n## 🧭 Le principe qui doit guider chaque décision\nFace à une question pratique nouvelle, la bonne démarche n'est ni de tout s'interdire par excès de prudence, ni de tout s'autoriser par confort — c'est de chercher un avis qualifié, contextualisé, plutôt que de trancher seul dans l'incertitude ou de suivre une rumeur.\n\n---\n\n> 🤲 Vivre sa foi en France n'est pas une contradiction à subir en silence — c'est un défi concret qui, abordé avec sagesse et un minimum de recherche, finit souvent par renforcer la foi plutôt que de l'affaiblir."},{"title":"1️⃣6️⃣ Protection spirituelle — Ruqya","content":"## 🛡️ La Ruqya, une réponse encadrée, pas de la magie\nLa Ruqya est le traitement islamique par le Coran et les invocations — une réponse reconnue au mauvais œil et à la sorcellerie, à une condition stricte : qu'elle ne comporte **aucune trace de shirk** dans sa pratique.\n\n## 👁️ Le mauvais œil ('Ayn) — pris au sérieux, sans excès\n*« Le mauvais œil est réel. »* (Hadith rapporté par Ibn Abbas — Sahih al-Bukhari et Sahih Muslim) Une phrase claire du Prophète ﷺ. La meilleure protection reste préventive : dire *MashaAllah, la quwwata illa billah* en admirant sincèrement quelque chose ou quelqu'un, garder des adhkar réguliers, réciter Ayat al-Kursi après chaque prière.\n\n## 🧿 La sorcellerie (Sihr) — un interdit sévère, dans les deux sens\nLa pratiquer, la demander à quelqu'un d'autre, ou consulter un sorcier ou un voyant constitue un **grand péché**. *« Celui qui consulte un devin et le croit a renié ce qui a été révélé à Muhammad ﷺ. »* (Hadith rapporté par Abu Hurayra — Musnad Ahmad et Sunan Abu Dawud, authentifié) — une sévérité qui montre à quel point ce sujet est pris au sérieux, dans les deux directions : la pratiquer ou y recourir sont également problématiques.\n\n## 🕋 Un protocole simple à pratiquer sur soi-même\nWudu accompagné d'une intention sincère → Al-Fatiha (7 fois) → Ayat al-Kursi (3 fois) → Al-Ikhlas, Al-Falaq et An-Nas (3 fois chacune) → une invocation personnelle de guérison et de protection contre le mauvais œil.\n\n## ⚠️ Ce qu'il faut absolument éviter\nLes voyants, les marabouts, les talismans, les amulettes — et surtout, ne **jamais** tenter de briser un envoûtement supposé par un autre envoûtement, une pratique qui aggrave le problème au lieu de le résoudre.\n\n---\n\n> 🤲 La meilleure protection reste, avant tout rituel spécifique, la régularité dans les adhkar quotidiens — un cœur qui se souvient constamment d'Allah devient, en lui-même, une véritable forteresse."},{"title":"1️⃣7️⃣ Calendrier islamique — les mois et leurs actes","content":"## 📅 Un calendrier vivant, pas juste une suite de dates\nCe cours complète celui sur le calendrier islamique déjà vu dans la page Fondamentaux, en se concentrant cette fois sur **ce qu'il y a concrètement à faire** mois après mois — un vrai programme d'actions, pas juste des repères chronologiques.\n\n## 🔴 Les 4 mois sacrés — un rappel essentiel\nMouharram, Rajab, Dhul-Qa'da, Dhul-Hijja : durant ces mois, les péchés pèsent plus lourd, et les bonnes actions sont davantage récompensées — une bonne raison d'y redoubler d'attention plutôt que de les traiter comme des mois ordinaires.\n\n## 🗓️ Ce qu'il y a à faire, mois par mois\n<table header-row=\"true\">\n<tr><td>Mois</td><td>À faire concrètement</td></tr>\n<tr><td>Mouharram</td><td>Jeûne d'Achoura (le 9+10 ou le 10+11)</td></tr>\n<tr><td>Rajab</td><td>Invocations renforcées, préparation spirituelle</td></tr>\n<tr><td>Sha'ban</td><td>Jeûnes fréquents, préparation active au Ramadan</td></tr>\n<tr><td>Ramadan</td><td>Jeûne, Tarawih, lecture du Coran, i'tikaf, sadaqah</td></tr>\n<tr><td>Shawwal</td><td>Eid, puis 6 jours de jeûne (équivaut à jeûner toute l'année)</td></tr>\n<tr><td>Dhul-Hijja</td><td>Takbir, jeûne d'Arafa, Udhiyya, Hajj si possible</td></tr>\n</table>\n\n## 💡 Une façon de voir ce calendrier qui change tout\nN'y vois pas une simple liste de dates à cocher au fil de l'année — vois-le comme un vrai **programme d'entraînement spirituel**, avec des phases d'effort intense (Ramadan, les 10 jours de Dhul-Hijja) suivies de phases de préparation plus douce (Sha'ban). Exactement comme un sportif alterne les périodes de charge et de récupération active.\n\n---\n\n> 🤲 Le calendrier islamique est un rythme spirituel offert, pas une contrainte imposée — vivre selon ce rythme, c'est refuser de laisser une année entière filer sans temps forts marqués."},{"title":"1️⃣8️⃣ Les 4 grandes écoles juridiques (Madhahib)","content":"## 🤔 Une question qui surprend souvent\nPourquoi existe-t-il 4 écoles juridiques différentes en Islam, et pas une seule règle unique valable partout ? Beaucoup y voient d'abord une source de confusion — alors que la tradition majoritaire y voit plutôt une richesse.\n\n## 📜 Ce que sont réellement ces écoles\nLes 4 grandes écoles juridiques sunnites (madhahib) sont des méthodes d'interprétation du Coran et de la Sunna, développées entre le 8e et le 9e siècle par des savants rigoureux. Elles s'accordent toutes sur les fondamentaux absolus de la foi — le Tawhid, les 5 piliers, les 6 piliers de la foi — et divergent uniquement sur des détails pratiques d'application.\n\n## 🗺️ Les 4 écoles, et où elles dominent aujourd'hui\n- **Hanafite** (fondée par Abou Hanifa) — la plus répandue au monde ; Turquie, Balkans, Asie centrale et du Sud\n- **Malikite** (Malik ibn Anas) — Afrique du Nord et de l'Ouest ; l'école majoritaire chez les musulmans de France d'origine maghrébine\n- **Chafiite** (Ash-Shafi'i) — Égypte, Afrique de l'Est, Asie du Sud-Est\n- **Hanbalite** (Ahmad ibn Hanbal) — Arabie Saoudite et pays du Golfe, avec un attachement particulièrement strict au hadith\n\n## 🔑 Le point le plus important à retenir\nLes 4 écoles sont **toutes reconnues comme légitimes** — aucune n'est \"plus vraie\" ou \"plus authentique\" que les autres. Contrairement à une idée reçue, un musulman n'est absolument pas obligé de suivre une seule école toute sa vie sans jamais en dévier.\n\n## 💡 Pourquoi ces divergences sont vues comme une richesse\nDe nombreux savants considèrent ces divergences (ikhtilaf) non pas comme une faiblesse ou une division, mais comme une véritable miséricorde — elles permettent d'adapter la pratique religieuse à des contextes très différents (climat, culture, situation économique) sans jamais toucher aux fondamentaux de la foi.\n\n---\n\n> 🤲 4 chemins juridiques différents, une seule et même destination — ce sont des outils construits pour comprendre et appliquer la religion, jamais des lignes de division entre musulmans."}],"priere":[{"title":"1️⃣ Les Ablutions (Wudu)","content":"## 💧 Pourquoi purifier le corps avant de parler à Allah ?\nAvant chaque prière, le corps doit être en état de pureté rituelle : c'est le Wudu. Ce n'est pas un simple geste d'hygiène — c'est une préparation qui accompagne l'entrée en présence d'Allah.\n\n## 📿 L'intention et la formule d'ouverture\nLe Wudu commence par une intention silencieuse (Niyya), puis on dit **Bismillah** avant de commencer les gestes.\n\n## 🧴 Les 8 étapes, dans l'ordre exact\n1. **Les mains** — lavées 3 fois, jusqu'aux poignets\n2. **La bouche** — rincée 3 fois\n3. **Le nez** — de l'eau aspirée puis rejetée, 3 fois\n4. **Le visage** — lavé 3 fois, du haut du front au menton, d'une oreille à l'autre\n5. **Les bras** — 3 fois chacun, jusqu'aux coudes, le droit puis le gauche\n6. **La tête** — essuyée une seule fois avec les mains humides\n7. **Les oreilles** — essuyées une seule fois, la droite puis la gauche\n8. **Les pieds** — lavés 3 fois chacun, jusqu'aux chevilles, le droit puis le gauche\n\n## 🚫 Ce qui annule le Wudu\n- Aller aux toilettes (petits ou grands besoins)\n- L'émission de gaz\n- L'émission de liquide pré-éjaculatoire, ou l'éjaculation\n- Un sommeil profond, ou une perte de conscience\n- Toucher directement ses parties intimes avec la main\n- Avoir un contact physique avec une personne du sexe opposé en y trouvant du plaisir\n- Toucher la bave d'un chien\n\nSi l'un de ces cas survient, le Wudu doit être refait avant la prière suivante.\n\n## ✅ Après le Wudu\nUne fois les 8 étapes terminées, on peut prononcer la Shahada : **« Ash-hadu an la ilaha illa Allah, wa ash-hadu anna Muhammadan abduhu wa rasuluh »** — « J'atteste qu'il n'y a de divinité digne d'adoration qu'Allah, et j'atteste que Muhammad est Son serviteur et Son messager. »\n\n## 🛁 Les grandes ablutions (Ghusl)\nLe Wudu suffit dans la grande majorité des cas, mais certains états d'impureté majeure exigent un lavage complet du corps : le Ghusl.\n\n### Quand le Ghusl est obligatoire\n- Après un rapport conjugal, avec ou sans éjaculation\n- Après une éjaculation, avec ou sans rapport\n- À la fin des règles\n- À la fin des saignements après un accouchement\n- Lors d'une conversion à l'Islam\n\n### Quand le Ghusl est recommandé, sans être obligatoire\n- Avant la prière du vendredi (Jumu'a)\n- Avant les deux grandes fêtes (Aïd al-Fitr et Aïd al-Adha)\n- Avant d'entrer en état d'Ihram, pour le pèlerinage\n\n### Le déroulement du Ghusl\n1. Formuler l'intention (Niyya)\n2. Se laver les mains\n3. Laver les parties intimes\n4. Faire un Wudu complet, comme pour la prière\n5. Verser de l'eau sur tout le corps — le côté droit puis le gauche — jusqu'à ce qu'aucune partie ne reste sèche, cheveux compris\n\nTant que le Ghusl obligatoire n'a pas été accompli, aucune prière ne peut être validée — le Wudu seul ne suffit pas à lever une impureté majeure.\n\n---\n\n> 🤲 Huit gestes simples, répétés plusieurs fois par jour — un rituel qui prépare autant le corps que le cœur avant de se tenir devant Allah."},{"title":"2️⃣ Qu'est-ce qu'une Rak'a ?","content":"## 🧎 Une unité de prière, pas juste un mouvement\nUne **rak'a** est l'unité de base qui compose chaque prière — un enchaînement complet de positions et de paroles, répété un nombre précis de fois selon la prière (2 à Fajr, 4 à Dhuhr/Asr/Isha, 3 à Maghrib).\n\n## 🔄 Le déroulement d'une rak'a, position par position\n<table header-row=\"true\">\n<tr><td>Position</td><td>Ce que fait le corps</td><td>Ce qu'on dit</td></tr>\n<tr><td>🧍 1. Takbir</td><td>Debout, pieds légèrement écartés, mains levées paumes vers l'avant à hauteur des oreilles</td><td>« Allahu Akbar » — Allah est plus grand</td></tr>\n<tr><td>🧍 2. Qiyam</td><td>Debout, mains croisées sur la poitrine (droite sur gauche)</td><td>Al-Fatiha, puis une sourate courte au choix</td></tr>\n<tr><td>🙇 3. Ruku'</td><td>Buste incliné à 90°, dos bien à plat, mains posées à plat sur les genoux</td><td>« Subhana Rabbiyal 'Adhim » (x3) — Gloire à mon Seigneur le Très Grand</td></tr>\n<tr><td>🧍 4. Redressement</td><td>Retour debout, bras relâchés le long du corps</td><td>« Sami Allahu liman hamidah », puis « Rabbana wa lakal hamd »</td></tr>\n<tr><td>🕌 5. Sujud</td><td>Prosterné au sol : front, nez, les deux mains, les deux genoux et les orteils des deux pieds touchent le sol</td><td>« Subhana Rabbiyal A'la » (x3) — Gloire à mon Seigneur le Très Haut</td></tr>\n<tr><td>🧎 6. Julus</td><td>À genoux, assis en arrière sur le pied gauche replié à plat au sol, le pied droit redressé et les orteils repliés vers la Qibla — <em>pas assis sur une chaise, ni sur les fesses au sol</em></td><td>« Rabbi ghfir li » — Seigneur, pardonne-moi</td></tr>\n<tr><td>🕌 7. Deuxième Sujud</td><td>Identique à la première prosternation</td><td>« Subhana Rabbiyal A'la » (x3)</td></tr>\n</table>\n\nCe cycle complet — Takbir, Qiyam, Ruku', Sujud, Julus, Sujud — constitue **une seule rak'a**. On se relève ensuite pour recommencer, ou on reste dans la position à genoux (Julus) pour le Tashahhud si c'est la dernière rak'a.\n\n## 🧭 Pourquoi cette structure ne change jamais\nChaque position porte un sens précis : debout, on se présente devant Allah. Incliné, on reconnaît Sa grandeur. Prosterné, on touche le sol au point le plus proche qu'un être humain puisse être de son Créateur. Ce n'est jamais un hasard si l'ordre est toujours le même.\n\n---\n\n> 🤲 Une rak'a n'est pas une suite de gestes mécaniques — c'est une conversation complète avec Allah, qui se répète à l'identique, prière après prière, toute une vie."},{"title":"3️⃣ Ce qu'il faut dire pendant la prière","content":"## 🕐 Les 5 prières et leur structure\n<table header-row=\"true\">\n<tr><td>Prière</td><td>Rak'at</td><td>Voix</td></tr>\n<tr><td>Fajr</td><td>2</td><td>Haute</td></tr>\n<tr><td>Dhuhr</td><td>4</td><td>Basse</td></tr>\n<tr><td>Asr</td><td>4</td><td>Basse</td></tr>\n<tr><td>Maghrib</td><td>3</td><td>Haute les 2 premières rak'at, puis basse</td></tr>\n<tr><td>Isha</td><td>4</td><td>Haute les 2 premières rak'at, puis basse</td></tr>\n</table>\nDans chaque rak'a, on récite toujours Al-Fatiha — obligatoire, sans exception. Une sourate courte s'y ajoute uniquement dans les deux premières rak'at de chaque prière.\n\n## 🔢 Ce qui change rak'a par rak'a\nChaque case indique ce qui est récité pendant cette rak'a, et ce qui la suit immédiatement (position assise) avant de passer à la suivante.\n<table header-row=\"true\">\n<tr><td>Prière</td><td>Rak'a 1</td><td>Rak'a 2</td><td>Rak'a 3</td><td>Rak'a 4</td></tr>\n<tr><td>Fajr (2)</td><td>Al-Fatiha + sourate</td><td>Al-Fatiha + sourate → Tachahhud complet → Salam</td><td>—</td><td>—</td></tr>\n<tr><td>Dhuhr (4)</td><td>Al-Fatiha + sourate</td><td>Al-Fatiha + sourate → Tachahhud partiel</td><td>Al-Fatiha seule</td><td>Al-Fatiha seule → Tachahhud complet → Salam</td></tr>\n<tr><td>Asr (4)</td><td>Al-Fatiha + sourate</td><td>Al-Fatiha + sourate → Tachahhud partiel</td><td>Al-Fatiha seule</td><td>Al-Fatiha seule → Tachahhud complet → Salam</td></tr>\n<tr><td>Maghrib (3)</td><td>Al-Fatiha + sourate</td><td>Al-Fatiha + sourate → Tachahhud partiel</td><td>Al-Fatiha seule → Tachahhud complet → Salam</td><td>—</td></tr>\n<tr><td>Isha (4)</td><td>Al-Fatiha + sourate</td><td>Al-Fatiha + sourate → Tachahhud partiel</td><td>Al-Fatiha seule</td><td>Al-Fatiha seule → Tachahhud complet → Salam</td></tr>\n</table>\nDeux repères simples à retenir : la sourate courte ne s'ajoute jamais au-delà des 2 premières rak'at, et le Tachahhud partiel n'existe que pour les prières de plus de 2 rak'at — sur la dernière rak'a de chaque prière, c'est toujours le Tachahhud complet qui clôt avec le Salam.\n\n### 🧭 Exemple concret, pas à pas : la prière de Dhuhr\n1. **Rak'a 1** — debout : Al-Fatiha + une sourate courte\n2. **Rak'a 2** — debout : Al-Fatiha + une sourate courte, puis on s'assoit (Julus) pour le **Tachahhud partiel**\n3. **Rak'a 3** — on se relève, debout : Al-Fatiha **seule**, sans sourate\n4. **Rak'a 4** — Al-Fatiha seule à nouveau, puis on s'assoit pour le **Tachahhud complet** et le Salam qui termine la prière\n\n## 📗 Des sourates courtes, faciles à apprendre en premier\nSourate 105 (Al-Fil), 106 (Quraysh), 107 (Al-Ma'un), 108 (Al-Kawthar), 109 (Al-Kafirun), 110 (An-Nasr), 111 (Al-Masad), 112 (Al-Ikhlas), 113 (Al-Falaq), 114 (An-Nas) — ce sont les plus courtes du Coran, souvent les premières apprises, et parfaitement adaptées à la sourate récitée après Al-Fatiha.\n\n## 📖 Al-Fatiha, phonétique et traduction\n**Bismi Allāhi Ar-Raĥmāni Ar-Raĥīmi**\nAu nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux.\n\n**Al-Ĥamdu Lillāhi Rabbi Al-'Ālamīna**\nLouange à Allah, Seigneur de l'univers.\n\n**Ar-Raĥmāni Ar-Raĥīmi**\nLe Tout Miséricordieux, le Très Miséricordieux.\n\n**Māliki Yawmi Ad-Dīni**\nMaître du Jour de la rétribution.\n\n**'Iyāka Na'budu Wa 'Iyāka Nasta'īnu**\nC'est Toi Seul que nous adorons, et c'est Toi Seul dont nous implorons secours.\n\n**Ihdinā Aş-Şirāţa Al-Mustaqīma**\nGuide-nous dans le droit chemin.\n\n**Şirāţa Al-Ladhīna 'An'amta 'Alayhim Ghayri Al-Maghđūbi 'Alayhim Wa Lā Ađ-Đāllīna**\nLe chemin de ceux que Tu as comblés de faveurs, non pas de ceux qui ont encouru Ta colère, ni des égarés.\n\n## 🗣️ Les paroles dites à chaque position (rappel)\n- Takbir : *Allahu Akbar*\n- Inclinaison (Ruku') : *Subhana Rabbiyal 'Adhim* (x3)\n- Redressement : *Sami Allahu liman hamidah, Rabbana wa lakal hamd*\n- Prosternation (Sujud) : *Subhana Rabbiyal A'la* (x3)\n- Entre les deux prosternations : *Rabbi ghfir li*\n\n*(Le déroulement complet d'une rak'a est détaillé dans le cours précédent.)*\n\n## 🙏 Après la prière — le Dhikr\nUne fois la prière terminée, il est recommandé de dire (Hadith rapporté par Abu Hurayra — Sahih Muslim n°939) :\n- **33 fois** *SubhanAllah*\n- **33 fois** *Alhamdulillah*\n- **33 fois** *Allahu Akbar*\n\n---\n\n> 🤲 Chaque mot prononcé dans la prière a un sens précis — les apprendre, ce n'est pas juste mémoriser une formule, c'est comprendre ce qu'on est réellement en train de dire à Allah."},{"title":"4️⃣ Le Tashahhud","content":"## 🧎🏽‍♂️ Un moment de pause, à genoux\nLe Tashahhud (aussi appelé At-Tahiyyat) se récite dans la position du Julus — à genoux, assis en arrière sur le pied gauche replié, le pied droit redressé — et non assis sur une chaise ou sur les fesses. Cette position revient à deux moments précis de la prière : après la 2e rak'a (Tashahhud partiel) et à la toute fin de la prière (Tashahhud complet).\n\n## 📖 Le Tashahhud partiel — phonétique et traduction\n**At-tahiyyâtu li-llâh, a-s-salawâtu wa-t-tayyibat.**\nLes salutations sont pour Allah, ainsi que les prières et les bonnes œuvres.\n\n**As-salâmu 'ala-n-nabiyyi wa rahmatu-llâhi wa barakâtuh.**\nQue la paix soit sur le Prophète, ainsi que la miséricorde d'Allah et Sa bénédiction.\n\n**As-salâmu 'alayanâ wa 'alâ 'ibâdi-llâhi-s-sâlihîn.**\nQue la paix soit sur nous et sur les pieux serviteurs d'Allah.\n\n**Ash-hadu an lâ ilâha illa-llâh, wa ash-hadu anna Muhammadan 'abduhu wa rasûluh.**\nJ'atteste qu'il n'y a de divinité digne d'adoration qu'Allah, et j'atteste que Muhammad est Son serviteur et Son messager.\n\nCe Tashahhud partiel se récite après la 2e rak'a de chaque prière (à Fajr, qui ne compte que 2 rak'at en tout, il devient directement le Tashahhud complet).\n\n## 📖 Le Tashahhud complet — ce qu'on y ajoute\nÀ la toute dernière position assise de la prière, on récite le Tashahhud partiel **puis** on ajoute :\n\n**Allahoumma salli 'ala Mouhammadin wa 'ala âli Mouhammad, kama sallayta 'ala Ibrahima wa 'ala âli Ibrahim, innaka Hamidoun Majid.**\nÔ Allah, prie sur Muhammad et sa famille, comme Tu as prié sur la famille d'Ibrahim, Tu es le seul digne de louange, le Glorieux.\n\n**Allahoumma barik 'ala Mouhammadin wa 'ala âli Mouhammad, kama barakta 'ala Ibrahima wa 'ala âli Ibrahim, innaka Hamidoun Majid.**\nÔ Allah, bénis Muhammad et sa famille, comme Tu as béni la famille d'Ibrahim, Tu es le seul digne de louange, le Glorieux.\n\n## 👋 Le Salam — la sortie de la prière\nLa prière se termine en tournant la tête à droite puis à gauche, en disant à chaque fois : **« As-salamu 'alaykum wa rahmatullah »** — Que la paix et la miséricorde d'Allah soient sur vous.\n\n---\n\n> 🤲 Le Tashahhud referme chaque prière sur les mêmes mots que le Prophète ﷺ prononçait lui-même — une façon de clore la conversation avec Allah exactement comme Il l'a enseignée."}],"noms":[{"title":"1️⃣ Les Noms d'Allah 1 à 10","content":"## Bienvenue dans les 99 Noms d'Allah\nCette série regroupe **10 parties**, pour découvrir les 99 plus beaux noms d'Allah (Asma'ul Husna) par groupes de 10 (la dernière partie en compte 9). Chaque partie donne les noms en arabe, leur transcription, leur signification, et une courte explication pour donner vie à chaque nom.\n\n> 📖 Allah dit dans le Coran : *« C'est à Allah qu'appartiennent les noms les plus beaux. Invoquez-Le par ces noms »* (Sourate Al-A'raf, 7:180). Et le Prophète ﷺ a dit : *« Allah a quatre-vingt-dix-neuf noms, cent moins un ; quiconque les dénombre entrera au Paradis »* (Hadith rapporté par Abu Hurayra — Sahih al-Bukhari n°2736, Sahih Muslim n°2677).\n\n> 🤲 « Dénombrer » ces noms, selon les savants, ne veut pas seulement dire les compter ou les mémoriser par cœur — c'est surtout comprendre leur sens et agir en conséquence dans sa vie.\n\n## 1️⃣ Ar-Rahman (الرَّحْمَٰنُ) — Le Tout Miséricordieux\nCe nom décrit une miséricorde immense qui englobe **toute la création, croyants et mécréants confondus** — comme le soleil qui réchauffe tout le monde sans distinction. C'est pour cela qu'il ouvre presque toutes les sourates du Coran (« Bismillahi Rahmani Rahim ») : avant même de parler d'obligations, Allah rappelle qu'Il est avant tout miséricordieux.\n\n## 2️⃣ Ar-Rahim (الرَّحِيمُ) — Le Très Miséricordieux\nLà où Ar-Rahman est une miséricorde générale, Ar-Rahim désigne une miséricorde **spécifique, réservée aux croyants**, ici-bas et surtout dans l'au-delà — comme un parent qui aime tous ses enfants, mais qui réserve une attention particulière à celui qui suit ses conseils.\n\n## 3️⃣ Al-Malik (الْمَلِكُ) — Le Roi, le Souverain\nAllah est le seul vrai Roi, propriétaire absolu de tout ce qui existe — les rois de ce monde ne possèdent rien réellement, ils gèrent temporairement ce qui appartient à Allah. *Se rappeler ce nom aide à relativiser le pou
