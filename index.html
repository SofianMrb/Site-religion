async function createMember(){
 let n=(document.getElementById('nameInput')?.value||'').trim(),p=getPin();
 if(!n||!validPin(p)){showAuthError('Indique un prénom et un code à 4 chiffres.');return}
 let all=members(),key=memberKey(n,p);
 if(all[key]){showAuthError('Ce profil existe déjà. Utilise « J’ai déjà un profil ».');return}
 let cloudData=await cloudFetch(key);
 if(cloudData){
  all[key]=cloudData;setMembers(all);
  state.name=cloudData.name;state.pin=p;state.memberKey=key;state.progress=cloudData.progress||{};state.section='home';state.authMode='login';render();return
 }
 all[key]={name:n,pin:p,progress:{},createdAt:Date.now()};setMembers(all);
 cloudPush(key,all[key]);
 state.name=n;state.pin=p;state.memberKey=key;state.progress={};state.section='home';state.authMode='login';render()
}
function mergeProgress(local,cloud){
 let merged={...(local||{})};
 for(const k of Object.keys(cloud||{})){
  let cv=cloud[k],lv=merged[k];
  if(lv===undefined){merged[k]=cv;continue}
  if(typeof cv==='number'||typeof lv==='number'){merged[k]=Math.max(Number(cv)||0,Number(lv)||0)}
  else{merged[k]=!!lv||!!cv}
 }
 return merged
}
async function syncProgressFromCloud(key){
 if(!cloudDB)return;
 let cloudData=await cloudFetch(key);
 if(!cloudData)return;
 let all=members(),local=all[key];
 if(!local)return;
 let merged=mergeProgress(local.progress,cloudData.progress);
 let changed=JSON.stringify(merged)!==JSON.stringify(local.progress||{});
 if(changed){
  all[key]={...local,progress:merged};
  setMembers(all);
  cloudPush(key,all[key]);
  if(state.memberKey===key){state.progress=merged;render()}
 }
}
async function loginProfile(){
 let n=(document.getElementById('loginName')?.value||'').trim(),p=(document.getElementById('loginPin')?.value||'').trim();
 if(!n||!validPin(p)){showAuthError('Indique ton prénom et ton code à 4 chiffres.');return}
 let found=findMember(n,p);
 if(found){
  state.name=found.member.name;state.pin=p;state.memberKey=found.key;state.progress=found.member.progress||{};state.section='home';render();
  syncProgressFromCloud(found.key);
  return
 }
 showAuthError('Recherche de ton profil en ligne...');
 let key=memberKey(n,p);
 let cloudData=await cloudFetch(key);
 if(cloudData&&cloudData.pin===p){
  let all=members();all[key]=cloudData;setMembers(all);
  state.name=cloudData.name;state.pin=p;state.memberKey=key;state.progress=cloudData.progress||{};state.section='home';render();return
 }
 showAuthError('Profil introuvable. Vérifie ton prénom et ton code.')
}
function loginPin(){loginProfile()}
function grantAdmin(){state.name=defaultAdminUser;state.pin='';state.memberKey='';state.progress={};state.admin=true;state.adminAuthenticated=true;state.section='admin';render();refreshMembersFromCloud()}
async function adminLogin(){
 let u=(document.getElementById('adminUserInput')?.value||'').trim(),p=(document.getElementById('adminPinInput')?.value||'').trim();
 if(normalizeName(u)!==normalizeName(defaultAdminUser)){showAuthError('Identifiant ou code administrateur incorrect.');return}
 if(cloudDB){
  let cloudPin=await cloudFetchAdminPin();
  if(validPin(cloudPin)){
   if(p===cloudPin){localStorage.setItem(ADMIN,cloudPin);grantAdmin();return}
   showAuthError('Identifiant ou code administrateur incorrect.');return
  }
 }
 if(p===adminPin()){grantAdmin();return}
 showAuthError('Identifiant ou code administrateur incorrect.')
}
function toggleAdmin(){if(state.adminAuthenticated){state.admin=true;state.section='admin';render()}else{openAdminLogin()}}
function backToSite(){state.admin=false;state.section='home';render()}
function totalItems(){return Object.values(DATA.catalog.courses).reduce((a,x)=>a+x.length,0)+Object.values(DATA.catalog.quizzes).reduce((a,x)=>a+x.length,0)}
function doneCount(){return Object.values(state.progress).filter(v=>v===true||typeof v==='number').length}
function pct(){let t=totalItems();return t?Math.round(doneCount()/t*100):0}
function progressByCategory(){return categories.map(c=>{let ct=DATA.catalog.courses[c.id]||[],qt=DATA.catalog.quizzes[c.id]||[];let cd=ct.filter((_,i)=>state.progress['course-'+c.id+'-'+(i+1)]!==undefined).length;let qd=qt.filter((_,i)=>state.progress['quiz-'+c.id+'-'+(i+1)]!==undefined).length;let total=ct.length+qt.length,done=cd+qd;return {...c,total,done,cd,qd,p:total?Math.round(done/total*100):0}})}
function home(){let by=progressByCategory();return header()+'<main class="container"><section class="hero"><p class="eyebrow">ASSALAMU ALEYKUM, '+esc(state.name.toUpperCase())+'</p><h1>Ton parcours d’apprentissage.</h1><p class="muted">Ton avancement est conservé dans ton profil grâce à ton code personnel.</p></section><section class="progress-card"><div><span>Progression globale</span><strong>'+pct()+'%</strong></div><div class="progress"><i style="width:'+pct()+'%"></i></div><div class="progress-detail">'+by.map(c=>'<div class="progress-line"><div><strong>'+c.icon+' '+esc(c.title)+'</strong><span>'+c.done+'/'+c.total+'</span></div><div class="mini-progress"><i style="width:'+c.p+'%"></i></div></div>').join('')+'</div></section><div class="choice-grid"><button class="big-card" onclick="go(\'courses\')"><span class="card-icon">📖</span><div><h2>Cours</h2><p>Étudie les grandes catégories.</p></div>›</button><button class="big-card" onclick="go(\'quizzes\')"><span class="card-icon">🧠</span><div><h2>Quiz</h2><p>Teste tes connaissances et suis tes résultats.</p></div>›</button></div></main>'}
function sectionPage(t){let course=t==='courses';return header()+'<main class="container"><button class="back" onclick="go(\'home\')">← Accueil</button><section class="section-heading"><p class="eyebrow">'+(course?'APPRENTISSAGE':'ÉVALUATION')+'</p><h1>'+(course?'Cours':'Quiz')+'</h1><p class="muted">Choisis une catégorie.</p></section><div class="category-list">'+categories.map(c=>'<button class="category" onclick="state.category=\''+c.id+'\';state.mode=\''+(course?'course':'quiz')+'\';go(\'category\')"><span class="category-icon">'+c.icon+'</span><div><h2>'+esc(c.title)+'</h2><p>'+esc(c.description)+'</p></div>›</button>').join('')+'</div></main>'}
function categoryPage(){let type=state.mode==='course'?'courses':'quizzes',cat=categories.find(c=>c.id===state.category),list=DATA.catalog[type][state.category];return header()+'<main class="container"><button class="back" onclick="go(\''+(state.mode==='course'?'courses':'quizzes')+'\')">← Retour</button><section class="section-heading"><span class="category-icon large">'+cat.icon+'</span><p class="eyebrow">'+(state.mode==='course'?'COURS':'QUIZ')+'</p><h1>'+esc(cat.title)+'</h1><p class="muted">'+list.length+' contenus.</p></section><div class="lesson-list">'+list.map((title,i)=>{let key=state.mode+'-'+state.category+'-'+(i+1),ready=state.mode==='course'?!!effectiveCourse(state.category,i).content:!!DATA.quizzes[state.category]?.[i]?.questions?.length,done=state.progress[key]!==undefined;return '<button class="lesson lesson-button '+(done?'done-row ':'')+(ready?'':'not-ready')+'" '+(ready?'':'disabled')+' onclick="openItem(\''+state.mode+'\',\''+state.category+'\','+i+')"><span class="number">'+(i+1)+'</span><div><h3>'+esc(title)+'</h3><p>'+(ready?(state.mode==='course'?'Cours':'Quiz'):'Contenu indisponible')+'</p></div>'+(done?'<span class="done-badge">✓ Fait</span>':'<span class="push-right">›</span>')+'</button>'}).join('')+'</div></main>'}
function itemPage(){let type=state.mode==='course'?'courses':'quizzes',title=DATA.catalog[type][state.category][state.index],key=state.mode+'-'+state.category+'-'+(state.index+1);if(state.mode==='course'){let c=effectiveCourse(state.category,state.index);return header()+'<main class="container"><button class="back" onclick="go(\'category\')">← Retour</button><article class="content-card"><p class="eyebrow">COURS</p><h1>'+esc(c.title||title)+'</h1><div class="markdown">'+md(c.content)+'</div><button class="primary complete" onclick="mark(\''+key+'\',true)">'+(state.progress[key]?'✓ Cours déjà terminé':'✓ Marquer comme terminé')+'</button><button class="secondary" style="margin-top:10px" onclick="openItem(\'quiz\',\''+state.category+'\','+state.index+')">🧠 Faire le quiz de ce cours →</button></article></main>'}let quiz=DATA.quizzes[state.category][state.index],score=quiz.questions.reduce((s,q,i)=>s+(state.answers[i]===q.answer?1:0),0);let questions=quiz.questions.map((q,i)=>'<div class="quiz-question"><h3>'+(i+1)+'. '+esc(q.question)+'</h3><div class="choices">'+q.choices.map(c=>{let l=c[0],cl=state.submitted?(l===q.answer?'correct ':'')+(state.answers[i]===l?'selected':''):(state.answers[i]===l?'selected':'');return '<button class="'+cl+'" '+(state.submitted?'disabled':'')+' onclick="answer('+i+',\''+l+'\')">'+esc(c)+'</button>'}).join('')+'</div>'+(state.submitted?'<p class="explanation">✅ '+q.answer+' — '+esc(q.explanation||'Réponse expliquée dans le cours.')+'</p>':'')+'</div>').join('');return header()+'<main class="container"><button class="back" onclick="go(\'category\')">← Retour</button><article class="content-card"><p class="eyebrow">QUIZ</p><h1>'+esc(title)+'</h1><p class="muted">Réponds aux questions avant de consulter les réponses.</p><div class="quiz-list">'+questions+'</div>'+(state.submitted?'<div class="result"><div>🏆</div><strong>'+score+'/'+quiz.questions.length+'</strong><p>'+esc(quiz.result||'Quiz terminé.')+'</p></div>':'<button class="primary complete" onclick="submitQuiz(\''+key+'\')">Valider le quiz</button>')+'<button class="secondary" style="margin-top:10px" onclick="openItem(\'course\',\''+state.category+'\','+state.index+')">📖 Revoir le cours</button></article></main>'}
function answer(i,v){state.answers[i]=v;render()}
function submitQuiz(k){let q=DATA.quizzes[state.category][state.index];state.progress[k]=q.questions.reduce((s,x,i)=>s+(state.answers[i]===x.answer?1:0),0);state.submitted=true;saveActive();render()}

function adminPage(){if(!state.admin)return home();let all=members();let rows=Object.keys(all).map(p=>{let m=all[p],done=Object.values(m.progress||{}).filter(v=>v===true||typeof v==='number').length;return '<div class="admin-row"><div><strong>'+esc(m.name)+'</strong><div class="meta">Code : <b>'+esc(m.pin||p)+'</b> • '+done+'/'+totalItems()+' contenus</div></div><button onclick="resetMember(\''+p+'\')">Réinitialiser</button><button class="danger" onclick="deleteMember(\''+p+'\')">Supprimer</button></div>'}).join('')||'<p class="small-note">Aucun membre enregistré.</p>';let cats=Object.keys(DATA.catalog.courses);return header()+'<main class="container"><div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px"><button class="back" onclick="backToSite()">← Voir le site</button><button class="back" onclick="logout()">↪ Retour à la connexion</button></div><section class="section-heading"><p class="eyebrow">ADMINISTRATION</p><h1>Gestion du site</h1><p class="muted">Gestion simple des membres et des mises à jour de cours.</p></section><div class="admin-grid"><section class="admin-card"><h2>👥 Membres</h2><p class="small-note">'+(cloudDB?'☁️ Synchronisation en ligne active : un membre peut retrouver son profil et sa progression sur un autre appareil avec son prénom et son code.':'⚠️ Synchronisation en ligne indisponible pour le moment — les profils restent uniquement sur cet appareil.')+'</p><div class="admin-list">'+rows+'</div><h3>Ajouter un membre</h3><input class="admin-input" id="newMemberName" placeholder="Prénom"><input class="admin-input" id="newMemberPin" maxlength="4" inputmode="numeric" placeholder="Code à 4 chiffres" style="margin-top:8px"><div class="admin-actions"><button class="primary" onclick="adminAddMember()">Ajouter</button></div></section><section class="admin-card"><h2>📚 Mise à jour des cours</h2><p class="small-note">Tu peux préparer et enregistrer une modification locale sans toucher au contenu original.</p><select class="admin-select" id="editCat" onchange="fillEditor()" style="margin-top:10px">'+cats.map(c=>'<option value="'+esc(c)+'">'+esc(categories.find(x=>x.id===c)?.title||c)+'</option>').join('')+'</select><select class="admin-select" id="editCourse" onchange="fillEditor()" style="margin-top:8px"></select><input class="admin-input" id="editTitle" placeholder="Titre" style="margin-top:8px"><textarea class="admin-textarea" id="editContent" placeholder="Contenu du cours" style="margin-top:8px"></textarea><div class="admin-actions"><button class="primary" onclick="saveCourseEdit()">Enregistrer la mise à jour</button><button class="secondary" onclick="clearCourseEdit()">Revenir au contenu original</button></div></section><section class="admin-card"><h2>🔐 Sécurité</h2><p class="small-note">Le code administrateur actuel est masqué. Change-le si besoin.</p><input class="admin-input" id="newAdminPin" maxlength="4" inputmode="numeric" placeholder="Nouveau code admin"><div class="admin-actions"><button class="primary" onclick="changeAdminPin()">Changer le code</button></div></section><section class="admin-card"><h2>💾 Sauvegarde</h2><p class="small-note">Exporte les membres et les modifications de cours pour pouvoir les conserver ou les transférer.</p><div class="admin-actions"><button class="primary" onclick="exportData()">Exporter</button><button class="secondary" onclick="importData()">Importer</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="handleImport(event)"></section></div></main>'}
function adminAddMember(){
 let n=(document.getElementById('newMemberName')?.value||'').trim(),p=(document.getElementById('newMemberPin')?.value||'').trim();
 if(!n||!validPin(p))return alert('Prénom + code à 4 chiffres requis.');
 let all=members(),key=memberKey(n,p);
 if(all[key])return alert('Ce profil existe déjà.');
 all[key]={name:n,pin:p,progress:{},createdAt:Date.now()};setMembers(all);cloudPush(key,all[key]);render()
}
function resetMember(p){
 if(confirm('Réinitialiser toute la progression de '+(members()[p]?.name||'ce membre')+' ?')){
  let all=members();if(all[p]){all[p].progress={};setMembers(all);cloudPush(p,all[p])}render()
 }
}
function deleteMember(p){
 if(confirm('Supprimer ce membre et sa progression ?')){
  let all=members();delete all[p];setMembers(all);cloudDeleteMember(p);if(state.memberKey===p)logout();else render()
 }
}
function fillEditor(){let cat=document.getElementById('editCat')?.value,sel=document.getElementById('editCourse');if(!cat||!sel)return;let list=DATA.catalog.courses[cat]||[];sel.innerHTML=list.map((t,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(t)+'</option>').join('');let i=Number(sel.value||0),c=effectiveCourse(cat,i);document.getElementById('editTitle').value=c.title||list[i]||'';document.getElementById('editContent').value=c.content||''}
function saveCourseEdit(){let cat=document.getElementById('editCat')?.value,i=Number(document.getElementById('editCourse')?.value||0);if(!cat)return;let o=overrides();o[cat+'-'+i]={title:document.getElementById('editTitle').value,content:document.getElementById('editContent').value,updatedAt:Date.now()};setOverrides(o);cloudPushOverrides(o);alert('Mise à jour enregistrée'+(cloudDB?' et synchronisée en ligne.':' sur cet appareil.'));render()}
function clearCourseEdit(){let cat=document.getElementById('editCat')?.value,i=Number(document.getElementById('editCourse')?.value||0),o=overrides();delete o[cat+'-'+i];setOverrides(o);cloudPushOverrides(o);fillEditor();render()}
function changeAdminPin(){let p=(document.getElementById('newAdminPin')?.value||'').trim();if(!validPin(p))return alert('Le code doit contenir exactement 4 chiffres.');localStorage.setItem(ADMIN,p);cloudPushAdminPin(p);alert('Code administrateur modifié'+(cloudDB?' et synchronisé en ligne.':' sur cet appareil.'))}
function exportData(){let payload={members:members(),overrides:overrides(),adminPin:adminPin(),exportedAt:new Date().toISOString()};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='apprendre-islam-sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){document.getElementById('importFile').click()}
function handleImport(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.members)setMembers(d.members);if(d.overrides)setOverrides(d.overrides);if(validPin(d.adminPin))localStorage.setItem(ADMIN,d.adminPin);alert('Sauvegarde importée.');render()}catch(err){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)}
function render(){document.getElementById('root').innerHTML=!state.name?welcome():state.admin?adminPage():state.section==='home'?home():state.section==='courses'?sectionPage('courses'):state.section==='quizzes'?sectionPage('quizzes'):state.section==='category'?categoryPage():itemPage()}
render();

</script></body></html>
